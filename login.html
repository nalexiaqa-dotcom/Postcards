<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Postcards — Log In</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            overflow: hidden;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            color: #202020;

            background: #e9e4da;
        }


        /* =====================================================
           WORLD BACKGROUND
        ===================================================== */

        .world {
            position: fixed;
            inset: 0;

            overflow: hidden;

            background: #d9d3c8;

            z-index: -2;
        }


        .background-image {
            position: absolute;

            inset: -4%;

            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;

            opacity: 0;

            transform: scale(1.05);

            transition:
                opacity 1.5s ease,
                transform 8s ease;
        }


        .background-image.active {
            opacity: 1;

            transform: scale(1);
        }


        .world::after {
            content: "";

            position: absolute;

            inset: 0;

            background:
                linear-gradient(
                    90deg,
                    rgba(15, 15, 15, 0.48),
                    rgba(15, 15, 15, 0.16)
                );

            z-index: 3;

            pointer-events: none;
        }


        /* =====================================================
           TOP BAR
        ===================================================== */

        .top-bar {
            position: fixed;

            top: 0;
            left: 0;
            right: 0;

            padding: 28px 34px;

            display: flex;

            justify-content: space-between;
            align-items: center;

            z-index: 20;

            color: white;
        }


        .location {
            font-size: 10px;

            letter-spacing: 0.22em;

            text-transform: uppercase;

            opacity: 0.9;
        }


        .logo {
            font-size: 11px;

            font-weight: 700;

            letter-spacing: 0.32em;

            text-transform: uppercase;
        }


        /* =====================================================
           MAIN
        ===================================================== */

        .screen {
            position: relative;

            z-index: 10;

            width: 100%;
            height: 100vh;

            display: flex;

            align-items: center;
            justify-content: center;

            padding: 90px 25px 35px;
        }


        /* =====================================================
           LOGIN CARD
        ===================================================== */

        .login-card {
            position: relative;

            width: min(520px, 92vw);

            min-height: 500px;

            padding: 55px 60px;

            background:
                rgba(
                    247,
                    244,
                    237,
                    0.97
                );

            box-shadow:
                0 30px 70px
                rgba(0, 0, 0, 0.28);

            display: flex;

            flex-direction: column;

            justify-content: center;

            animation:
                cardEntrance
                0.8s
                cubic-bezier(.2,.8,.2,1)
                forwards;
        }


        @keyframes cardEntrance {

            from {
                opacity: 0;

                transform:
                    translateY(30px)
                    scale(0.98);
            }

            to {
                opacity: 1;

                transform:
                    translateY(0)
                    scale(1);
            }

        }


        /* =====================================================
           CARD HEADER
        ===================================================== */

        .brand {
            position: absolute;

            top: 32px;
            left: 35px;

            font-size: 10px;

            font-weight: 700;

            letter-spacing: 0.3em;

            text-transform: uppercase;
        }


        .eyebrow {
            font-size: 9px;

            font-weight: 700;

            letter-spacing: 0.22em;

            text-transform: uppercase;

            color: #777168;

            margin-bottom: 18px;
        }


        .login-heading {
            font-family:
                Georgia,
                "Times New Roman",
                serif;

            font-size: clamp(
                46px,
                7vw,
                68px
            );

            font-weight: 400;

            line-height: 0.93;

            letter-spacing: -0.045em;

            text-transform: uppercase;

            margin-bottom: 20px;
        }


        .description {
            max-width: 350px;

            font-size: 12px;

            line-height: 1.65;

            color: #65615a;

            margin-bottom: 35px;
        }


        /* =====================================================
           FORM
        ===================================================== */

        .form {
            width: 100%;
        }


        .field {
            margin-bottom: 20px;
        }


        .field label {
            display: block;

            font-size: 8px;

            font-weight: 700;

            letter-spacing: 0.18em;

            text-transform: uppercase;

            color: #777168;

            margin-bottom: 7px;
        }


        .input {
            width: 100%;

            padding: 12px 0;

            border: none;

            border-bottom:
                1px solid
                #aaa59c;

            background: transparent;

            outline: none;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            font-size: 13px;

            color: #202020;

            transition:
                border-color
                0.25s ease;
        }


        .input::placeholder {
            color: #aaa59c;
        }


        .input:focus {
            border-bottom:
                1px solid
                #202020;
        }


        /* =====================================================
           LOGIN BUTTON
        ===================================================== */

        .login-button {
            width: 100%;

            margin-top: 8px;

            padding: 16px 18px;

            border:
                1px solid
                #202020;

            background:
                #202020;

            color:
                #f7f4ed;

            font-size: 9px;

            font-weight: 700;

            letter-spacing: 0.2em;

            text-transform: uppercase;

            cursor: pointer;

            transition:
                background 0.25s ease,
                color 0.25s ease,
                transform 0.25s ease;
        }


        .login-button:hover {
            background:
                transparent;

            color:
                #202020;

            transform:
                translateY(-2px);
        }


        /* =====================================================
           ERROR MESSAGE
        ===================================================== */

        .error-message {
            display: none;

            margin-top: 15px;

            padding: 10px;

            text-align: center;

            font-size: 9px;

            line-height: 1.5;

            color: #7a3f3f;

            background:
                rgba(
                    122,
                    63,
                    63,
                    0.08
                );
        }


        .error-message.show {
            display: block;
        }


        /* =====================================================
           BACK LINK
        ===================================================== */

        .back-link {
            margin-top: 25px;

            text-align: center;

            font-size: 9px;

            color: #777168;

            letter-spacing: 0.08em;
        }


        .back-link button {
            border: none;

            background: transparent;

            padding: 0;

            margin-left: 4px;

            color: #202020;

            font-family: inherit;

            font-size: inherit;

            text-decoration: underline;

            text-underline-offset: 3px;

            cursor: pointer;
        }


        /* =====================================================
           POSTCARD DETAILS
        ===================================================== */

        .postmark {
            position: absolute;

            top: 25px;
            right: 28px;

            width: 54px;
            height: 54px;

            border:
                1px solid
                rgba(0,0,0,0.3);

            border-radius: 50%;

            display: flex;

            align-items: center;
            justify-content: center;

            text-align: center;

            font-size: 7px;

            letter-spacing: 0.08em;

            line-height: 1.4;

            text-transform: uppercase;

            color: #777168;

            transform:
                rotate(-12deg);

            opacity: 0.7;
        }


        .line {
            position: absolute;

            top: 25px;

            left: 35px;

            right: 100px;

            height: 1px;

            background:
                rgba(0,0,0,0.12);
        }


        /* =====================================================
           RESPONSIVE
        ===================================================== */

        @media (max-width: 600px) {

            .top-bar {
                padding:
                    20px;
            }


            .location {
                font-size: 8px;
            }


            .logo {
                font-size: 9px;

                letter-spacing:
                    0.22em;
            }


            .screen {
                padding:
                    80px 18px 25px;
            }


            .login-card {
                width: 94vw;

                min-height: 480px;

                padding:
                    50px 30px;
            }


            .brand {
                top: 25px;
                left: 28px;
            }


            .login-heading {
                font-size: 48px;
            }


            .postmark {
                top: 19px;
                right: 20px;
            }


            .line {
                left: 28px;
                right: 95px;
                top: 20px;
            }

        }

    </style>
</head>


<body>


    <!-- =====================================================
         WORLD BACKGROUND
    ===================================================== -->

    <div class="world">

        <div
            class="background-image active"
            id="backgroundA"
        ></div>

        <div
            class="background-image"
            id="backgroundB"
        ></div>

    </div>


    <!-- =====================================================
         TOP BAR
    ===================================================== -->

    <header class="top-bar">

        <div
            class="location"
            id="location"
        >
            Paris, France
        </div>

        <div class="logo">
            POSTCARDS
        </div>

    </header>


    <!-- =====================================================
         MAIN
    ===================================================== -->

    <main class="screen">

        <section class="login-card">

            <div class="brand">
                POSTCARDS
            </div>


            <div class="line"></div>


            <div class="postmark">
                EXPLORE<br>
                THE<br>
                WORLD
            </div>


            <div class="eyebrow">
                WELCOME BACK
            </div>


            <h1 class="login-heading">
                Log<br>
                in.
            </h1>


            <p class="description">
                Continue exploring universities,
                countries, and possibilities
                around the world.
            </p>


            <!-- =================================================
                 LOGIN FORM
            ================================================== -->

            <form
                class="form"
                id="loginForm"
            >

                <div class="field">

                    <label for="email">
                        Email address
                    </label>

                    <input
                        class="input"
                        id="email"
                        type="email"
                        placeholder="Your email address"
                        autocomplete="email"
                        required
                    >

                </div>


                <div class="field">

                    <label for="password">
                        Password
                    </label>

                    <input
                        class="input"
                        id="password"
                        type="password"
                        placeholder="Your password"
                        autocomplete="current-password"
                        required
                    >

                </div>


                <button
                    class="login-button"
                    type="submit"
                >
                    Log in →
                </button>


                <div
                    class="error-message"
                    id="errorMessage"
                ></div>

            </form>


            <!-- =================================================
                 BACK TO POSTCARD
            ================================================== -->

            <div class="back-link">

                <button
                    type="button"
                    id="backButton"
                >
                    ← Back to postcard
                </button>

            </div>

        </section>

    </main>


    <script>

        /* =====================================================
           DESTINATIONS
        ===================================================== */

        const destinations = [

            {
                name: "Paris, France",

                image:
                    "https://images.unsplash.com/photo-1502602898657-3e91760cbb34?auto=format&fit=crop&w=2200&q=90"
            },

            {
                name: "Tokyo, Japan",

                image:
                    "https://images.unsplash.com/photo-1513407030348-c983a97b98d8?auto=format&fit=crop&w=2200&q=90"
            },

            {
                name: "New York, USA",

                image:
                    "https://images.unsplash.com/photo-1496588152823-86ff7695e68f?auto=format&fit=crop&w=2200&q=90"
            },

            {
                name: "Barcelona, Spain",

                image:
                    "https://images.unsplash.com/photo-1539037116277-4db20889f2d4?auto=format&fit=crop&w=2200&q=90"
            },

            {
                name: "Seoul, South Korea",

                image:
                    "https://images.unsplash.com/photo-1538485399081-7c8979d1d5f1?auto=format&fit=crop&w=2200&q=90"
            },

            {
                name: "Santorini, Greece",

                image:
                    "https://images.unsplash.com/photo-1570077188670-e3a8d69ac5ff?auto=format&fit=crop&w=2200&q=90"
            },

            {
                name: "London, England",

                image:
                    "https://images.unsplash.com/photo-1513635269975-59663e0ac1ad?auto=format&fit=crop&w=2200&q=90"
            },

            {
                name: "Rome, Italy",

                image:
                    "https://images.unsplash.com/photo-1529260830199-42c24126f198?auto=format&fit=crop&w=2200&q=90"
            }

        ];


        /* =====================================================
           ELEMENTS
        ===================================================== */

        const backgroundA =
            document.getElementById(
                "backgroundA"
            );

        const backgroundB =
            document.getElementById(
                "backgroundB"
            );

        const locationText =
            document.getElementById(
                "location"
            );

        const loginForm =
            document.getElementById(
                "loginForm"
            );

        const errorMessage =
            document.getElementById(
                "errorMessage"
            );

        const backButton =
            document.getElementById(
                "backButton"
            );


        /* =====================================================
           BACKGROUND SYSTEM
        ===================================================== */

        let currentDestination = 0;

        let showingA = true;


        function preloadImages() {

            destinations.forEach(
                destination => {

                    const image =
                        new Image();

                    image.src =
                        destination.image;

                }
            );

        }


        function setInitialBackground() {

            backgroundA.style.backgroundImage =
                `url("${destinations[0].image}")`;

            locationText.textContent =
                destinations[0].name;

        }


        function changeDestination() {

            currentDestination++;

            if (
                currentDestination >=
                destinations.length
            ) {

                currentDestination = 0;

            }


            const destination =
                destinations[
                    currentDestination
                ];


            const nextBackground =
                showingA
                    ? backgroundB
                    : backgroundA;


            const oldBackground =
                showingA
                    ? backgroundA
                    : backgroundB;


            nextBackground.style.backgroundImage =
                `url("${destination.image}")`;


            const image =
                new Image();


            image.onload =
                function() {

                    nextBackground.classList.add(
                        "active"
                    );

                    oldBackground.classList.remove(
                        "active"
                    );

                    showingA =
                        !showingA;

                    locationText.textContent =
                        destination.name;

                };


            image.src =
                destination.image;

        }


        setInitialBackground();

        preloadImages();


        setInterval(
            changeDestination,
            4000
        );


        /* =====================================================
           LOGIN
        ===================================================== */

        loginForm.addEventListener(
            "submit",
            function(event) {

                event.preventDefault();


                const email =
                    document
                        .getElementById("email")
                        .value
                        .trim()
                        .toLowerCase();


                const password =
                    document
                        .getElementById("password")
                        .value;


                errorMessage.classList.remove(
                    "show"
                );


                /* ---------------------------------------------
                   CHECK THAT BOTH FIELDS ARE FILLED
                --------------------------------------------- */

                if (
                    !email ||
                    !password
                ) {

                    errorMessage.textContent =
                        "Please enter your email and password.";

                    errorMessage.classList.add(
                        "show"
                    );

                    return;

                }


                /* ---------------------------------------------
                   GET SAVED ACCOUNT
                --------------------------------------------- */

                const savedAccount =
                    localStorage.getItem(
                        "postcardsAccount"
                    );


                if (!savedAccount) {

                    errorMessage.textContent =
                        "No account was found. Please sign up first.";

                    errorMessage.classList.add(
                        "show"
                    );

                    return;

                }


                const account =
                    JSON.parse(
                        savedAccount
                    );


                /* ---------------------------------------------
                   CHECK EMAIL
                --------------------------------------------- */

                if (
                    account.email
                        .trim()
                        .toLowerCase()
                    !==
                    email
                ) {

                    errorMessage.textContent =
                        "That email does not match your Postcards account.";

                    errorMessage.classList.add(
                        "show"
                    );

                    return;

                }


                /* ---------------------------------------------
                   LOGIN SUCCESS
                   
                   This is currently a prototype, so the
                   password is required but is not verified
                   against a database.
                --------------------------------------------- */

                localStorage.setItem(
                    "postcardsLoggedIn",
                    "true"
                );


                localStorage.setItem(
                    "postcardsCurrentUser",
                    JSON.stringify(account)
                );


                /*
                   Continue to the questionnaire/app.
                */

                window.location.href =
                    "onboarding.html";

            }
        );


        /* =====================================================
           BACK TO POSTCARD
        ===================================================== */

        backButton.addEventListener(
            "click",
            function() {

                window.location.href =
                    "index.html";

            }
        );

    </script>

</body>
</html>
