<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Postcards — Create Your Account</title>


    <style>

        /* =====================================================
           RESET
        ===================================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        html,
        body {
            width: 100%;
            height: 100%;
        }


        body {

            overflow: hidden;

            font-family:
                Georgia,
                "Times New Roman",
                serif;

            color: #40362f;

            background: #d8c8b8;
        }


        /* =====================================================
           WORLD BACKGROUND
        ===================================================== */

        .world {

            position: fixed;

            inset: 0;

            overflow: hidden;

            background: #cbbba9;
        }


        .background-image {

            position: absolute;

            inset: -3%;

            background-size: cover;

            background-position: center;

            opacity: 0;

            transition:
                opacity 2s ease,
                transform 8s ease;

            transform: scale(1.03);
        }


        .background-image.active {

            opacity: 1;

            transform: scale(1);
        }


        .world::after {

            content: "";

            position: absolute;

            inset: 0;

            background:
                linear-gradient(
                    135deg,
                    rgba(35, 27, 23, 0.35),
                    rgba(35, 27, 23, 0.12)
                );

            z-index: 3;

            pointer-events: none;
        }


        /* =====================================================
           LOCATION
        ===================================================== */

        .location {

            position: fixed;

            top: 28px;

            left: 32px;

            z-index: 10;

            color:
                rgba(
                    255,
                    255,
                    255,
                    0.92
                );

            font-family:
                Arial,
                sans-serif;

            font-size: 11px;

            letter-spacing: 3px;

            text-transform: uppercase;

            text-shadow:
                0 2px 10px
                rgba(0,0,0,0.25);
        }


        /* =====================================================
           LOGO
        ===================================================== */

        .logo {

            position: fixed;

            top: 28px;

            right: 32px;

            z-index: 10;

            color:
                rgba(
                    255,
                    255,
                    255,
                    0.92
                );

            font-family:
                Arial,
                sans-serif;

            font-size: 11px;

            letter-spacing: 5px;

            text-shadow:
                0 2px 10px
                rgba(0,0,0,0.25);
        }


        /* =====================================================
           MAIN
        ===================================================== */

        .screen {

            position: relative;

            z-index: 5;

            width: 100%;

            height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 30px;
        }


        /* =====================================================
           ACCOUNT CARD
        ===================================================== */

        .account-card {

            width:
                min(
                    560px,
                    90vw
                );

            max-height: 88vh;

            background:
                linear-gradient(
                    135deg,
                    #fbf0df,
                    #f3e3cf
                );

            border:
                8px solid
                #fffaf2;

            border-radius: 4px;

            box-shadow:
                0 30px 60px
                rgba(0,0,0,0.38);

            position: relative;

            overflow: hidden;

            padding:
                48px 55px 42px;

            animation:
                cardEntrance
                0.8s
                cubic-bezier(.2,.8,.2,1)
                forwards;
        }


        @keyframes cardEntrance {

            from {

                opacity: 0;

                transform:
                    translateY(35px)
                    rotate(-1deg);
            }

            to {

                opacity: 1;

                transform:
                    translateY(0)
                    rotate(0);
            }
        }


        /* =====================================================
           PAPER TEXTURE
        ===================================================== */

        .account-card::before {

            content: "";

            position: absolute;

            inset: 0;

            background-image:
                radial-gradient(
                    rgba(
                        75,
                        55,
                        40,
                        0.09
                    )
                    0.7px,
                    transparent 0.7px
                );

            background-size: 5px 5px;

            opacity: 0.28;

            pointer-events: none;

            z-index: 1;
        }


        /* =====================================================
           CONTENT
        ===================================================== */

        .content {

            position: relative;

            z-index: 5;

            text-align: center;
        }


        .eyebrow {

            font-family:
                Arial,
                sans-serif;

            font-size: 10px;

            letter-spacing: 4px;

            color: #9a806e;

            margin-bottom: 17px;

            text-transform: uppercase;
        }


        h1 {

            font-size:
                clamp(
                    34px,
                    6vw,
                    52px
                );

            font-weight: normal;

            line-height: 1.05;

            color: #40362f;

            margin-bottom: 12px;
        }


        .description {

            font-family:
                Arial,
                sans-serif;

            font-size: 12px;

            line-height: 1.6;

            color: #806e60;

            max-width: 410px;

            margin:
                0 auto 28px;
        }


        /* =====================================================
           FORM
        ===================================================== */

        .form {

            width: 100%;

            text-align: left;
        }


        .name-row {

            display: grid;

            grid-template-columns:
                1fr 1fr;

            gap: 18px;
        }


        .field {

            margin-bottom: 16px;
        }


        .field label {

            display: block;

            font-family:
                Arial,
                sans-serif;

            font-size: 9px;

            letter-spacing: 2px;

            text-transform: uppercase;

            color: #806e60;

            margin-bottom: 5px;
        }


        .input {

            width: 100%;

            padding:
                12px 5px;

            border: none;

            border-bottom:
                1px solid
                #baa493;

            background: transparent;

            outline: none;

            font-family:
                Arial,
                sans-serif;

            font-size: 14px;

            color: #40362f;

            transition:
                border-color
                0.25s ease;
        }


        .input::placeholder {

            color: #a08c7c;
        }


        .input:focus {

            border-bottom:
                1px solid
                #625248;
        }


        /* =====================================================
           PASSWORD NOTE
        ===================================================== */

        .password-note {

            font-family:
                Arial,
                sans-serif;

            font-size: 9px;

            color: #9a8879;

            margin-top: -8px;

            margin-bottom: 17px;
        }


        /* =====================================================
           CREATE BUTTON
        ===================================================== */

        .create-button {

            width: 100%;

            border: none;

            background: #4c4038;

            color: #fffaf3;

            padding: 15px;

            margin-top: 4px;

            font-family:
                Arial,
                sans-serif;

            font-size: 10px;

            letter-spacing: 3px;

            cursor: pointer;

            transition:
                transform
                0.25s ease,
                background
                0.25s ease;
        }


        .create-button:hover {

            background: #67554a;

            transform:
                translateY(-2px);
        }


        /* =====================================================
           LOGIN LINK
        ===================================================== */

        .login-link {

            text-align: center;

            margin-top: 17px;

            font-family:
                Arial,
                sans-serif;

            font-size: 10px;

            color: #827064;
        }


        .login-link button {

            border: none;

            background: none;

            padding: 0;

            font-family: inherit;

            font-size: inherit;

            color: #4c4038;

            text-decoration: underline;

            cursor: pointer;
        }


        /* =====================================================
           STAMP
        ===================================================== */

        .stamp {

            position: absolute;

            top: 18px;

            right: 20px;

            width: 58px;

            height: 68px;

            border:
                2px dashed
                #aa8d76;

            display: flex;

            align-items: center;

            justify-content: center;

            text-align: center;

            font-family:
                Arial,
                sans-serif;

            font-size: 7px;

            letter-spacing: 1.5px;

            line-height: 1.5;

            color: #806b5c;

            transform:
                rotate(3deg);

            opacity: 0.75;
        }


        /* =====================================================
           AIRMAIL
        ===================================================== */

        .airmail {

            position: absolute;

            left: 14px;

            right: 14px;

            bottom: 12px;

            height: 4px;

            background:
                repeating-linear-gradient(
                    135deg,
                    #a17d6b 0 13px,
                    transparent 13px 22px,
                    #897c86 22px 35px,
                    transparent 35px 44px
                );

            opacity: 0.6;
        }


        /* =====================================================
           RESPONSIVE
        ===================================================== */

        @media (max-width: 650px) {

            .account-card {

                width: 92vw;

                padding:
                    42px 25px 38px;
            }


            .name-row {

                grid-template-columns:
                    1fr;

                gap: 0;
            }


            .location {

                top: 18px;

                left: 20px;

                font-size: 9px;

                letter-spacing: 2px;
            }


            .logo {

                top: 18px;

                right: 20px;

                font-size: 9px;

                letter-spacing: 3px;
            }


            .stamp {

                width: 48px;

                height: 56px;

                top: 12px;

                right: 12px;

                font-size: 6px;
            }
        }

    </style>

</head>


<body>


    <!-- =====================================================
         WORLD BACKGROUND
    ====================================================== -->

    <div class="world">

        <div
            class="background-image active"
            id="backgroundA"
        ></div>


        <div
            class="background-image"
            id="backgroundB"
        ></div>

    </div>



    <!-- =====================================================
         LOCATION
    ====================================================== -->

    <div
        class="location"
        id="location"
    >
        Paris, France
    </div>



    <!-- =====================================================
         LOGO
    ====================================================== -->

    <div class="logo">
        POSTCARDS
    </div>



    <!-- =====================================================
         MAIN
    ====================================================== -->

    <main class="screen">


        <section class="account-card">


            <div class="stamp">

                YOUR<br>
                JOURNEY

            </div>


            <div class="content">


                <div class="eyebrow">

                    WELCOME TO POSTCARDS

                </div>


                <h1>

                    Create your<br>
                    account.

                </h1>


                <p class="description">

                    Before we begin your journey,
                    tell us a little about yourself.

                </p>



                <!-- ==========================================
                     FORM
                =========================================== -->

                <form
                    class="form"
                    id="accountForm"
                >


                    <!-- NAME -->

                    <div class="name-row">


                        <div class="field">

                            <label for="firstName">
                                First name
                            </label>


                            <input
                                class="input"
                                id="firstName"
                                type="text"
                                placeholder="Your first name"
                                autocomplete="given-name"
                                required
                            >

                        </div>



                        <div class="field">

                            <label for="lastName">
                                Last name
                            </label>


                            <input
                                class="input"
                                id="lastName"
                                type="text"
                                placeholder="Your last name"
                                autocomplete="family-name"
                                required
                            >

                        </div>


                    </div>



                    <!-- EMAIL -->

                    <div class="field">

                        <label for="email">
                            Email address
                        </label>


                        <input
                            class="input"
                            id="email"
                            type="email"
                            placeholder="Your email address"
                            autocomplete="email"
                            required
                        >

                    </div>



                    <!-- PASSWORD -->

                    <div class="field">

                        <label for="password">
                            Password
                        </label>


                        <input
                            class="input"
                            id="password"
                            type="password"
                            placeholder="Create a password"
                            autocomplete="new-password"
                            required
                        >

                    </div>


                    <div class="password-note">

                        Use at least 8 characters.

                    </div>



                    <!-- CONFIRM PASSWORD -->

                    <div class="field">

                        <label for="confirmPassword">
                            Confirm password
                        </label>


                        <input
                            class="input"
                            id="confirmPassword"
                            type="password"
                            placeholder="Enter your password again"
                            autocomplete="new-password"
                            required
                        >

                    </div>



                    <!-- CREATE -->

                    <button
                        class="create-button"
                        type="submit"
                    >

                        CREATE MY ACCOUNT →

                    </button>


                </form>



                <!-- ==========================================
                     LOGIN
                =========================================== -->

                <div class="login-link">

                    Already have an account?

                    <button
                        id="loginLink"
                        type="button"
                    >

                        Log in

                    </button>

                </div>


            </div>


            <!-- AIRMAIL -->

            <div class="airmail"></div>


        </section>


    </main>



    <script>

        /* =====================================================
           DESTINATIONS
        ===================================================== */

        const destinations = [

            {
                name: "Paris, France",

                image:
                    "https://images.unsplash.com/photo-1502602898657-3e91760cbb34?auto=format&fit=crop&w=2200&q=90"
            },


            {
                name: "Tokyo, Japan",

                image:
                    "https://images.unsplash.com/photo-1513407030348-c983a97b98d8?auto=format&fit=crop&w=2200&q=90"
            },


            {
                name: "New York, USA",

                image:
                    "https://images.unsplash.com/photo-1496588152823-86ff7695e68f?auto=format&fit=crop&w=2200&q=90"
            },


            {
                name: "Barcelona, Spain",

                image:
                    "https://images.unsplash.com/photo-1539037116277-4db20889f2d4?auto=format&fit=crop&w=2200&q=90"
            },


            {
                name: "Seoul, South Korea",

                image:
                    "https://images.unsplash.com/photo-1538485399081-7c8979d1d5f1?auto=format&fit=crop&w=2200&q=90"
            },


            {
                name: "Santorini, Greece",

                image:
                    "https://images.unsplash.com/photo-1570077188670-e3a8d69ac5ff?auto=format&fit=crop&w=2200&q=90"
            },


            {
                name: "London, England",

                image:
                    "https://images.unsplash.com/photo-1513635269975-59663e0ac1ad?auto=format&fit=crop&w=2200&q=90"
            },


            {
                name: "Rome, Italy",

                image:
                    "https://images.unsplash.com/photo-1529260830199-42c24126f198?auto=format&fit=crop&w=2200&q=90"
            }

        ];



        /* =====================================================
           ELEMENTS
        ===================================================== */

        const backgroundA =
            document.getElementById(
                "backgroundA"
            );


        const backgroundB =
            document.getElementById(
                "backgroundB"
            );


        const locationText =
            document.getElementById(
                "location"
            );


        const accountForm =
            document.getElementById(
                "accountForm"
            );


        const loginLink =
            document.getElementById(
                "loginLink"
            );



        /* =====================================================
           BACKGROUND SYSTEM
        ===================================================== */

        let currentDestination = 0;

        let showingA = true;


        function preloadImages() {

            destinations.forEach(
                destination => {

                    const image =
                        new Image();

                    image.src =
                        destination.image;

                }
            );

        }


        function setInitialBackground() {

            backgroundA.style.backgroundImage =
                `url("${destinations[0].image}")`;

            locationText.textContent =
                destinations[0].name;

        }


        function changeDestination() {

            currentDestination++;

            if (
                currentDestination >=
                destinations.length
            ) {

                currentDestination = 0;

            }


            const destination =
                destinations[
                    currentDestination
                ];


            const nextBackground =
                showingA
                    ? backgroundB
                    : backgroundA;


            const oldBackground =
                showingA
                    ? backgroundA
                    : backgroundB;


            nextBackground.style.backgroundImage =
                `url("${destination.image}")`;


            const img =
                new Image();


            img.onload =
                function() {

                    nextBackground.classList.add(
                        "active"
                    );


                    oldBackground.classList.remove(
                        "active"
                    );


                    showingA =
                        !showingA;


                    locationText.textContent =
                        destination.name;

                };


            img.src =
                destination.image;

        }


        setInitialBackground();

        preloadImages();


        setInterval(
            changeDestination,
            7000
        );



        /* =====================================================
           ACCOUNT CREATION
        ===================================================== */

        accountForm.addEventListener(
            "submit",
            function(event) {

                event.preventDefault();


                const firstName =
                    document.getElementById(
                        "firstName"
                    ).value.trim();


                const lastName =
                    document.getElementById(
                        "lastName"
                    ).value.trim();


                const email =
                    document.getElementById(
                        "email"
                    ).value.trim();


                const password =
                    document.getElementById(
                        "password"
                    ).value;


                const confirmPassword =
                    document.getElementById(
                        "confirmPassword"
                    ).value;



                /* ==========================================
                   PASSWORD LENGTH
                =========================================== */

                if (
                    password.length < 8
                ) {

                    alert(
                        "Your password must contain at least 8 characters."
                    );

                    return;

                }



                /* ==========================================
                   PASSWORD MATCH
                =========================================== */

                if (
                    password !==
                    confirmPassword
                ) {

                    alert(
                        "The passwords do not match."
                    );

                    return;

                }



                /* ==========================================
                   SAVE ACCOUNT INFORMATION
                =========================================== */

                const account = {

                    firstName:
                        firstName,

                    lastName:
                        lastName,

                    email:
                        email

                };


                localStorage.setItem(
                    "postcardsAccount",
                    JSON.stringify(
                        account
                    )
                );



                /*
                    We intentionally do NOT save
                    the password in localStorage.

                    A real account system will
                    eventually handle authentication
                    securely through a backend.
                */



                /* ==========================================
                   GO TO ONBOARDING
                =========================================== */

                window.location.href =
                    "onboarding.html";

            }
        );



        /* =====================================================
           LOGIN LINK
        ===================================================== */

        loginLink.addEventListener(
            "click",
            function() {

                window.location.href =
                    "index.html";

            }
        );

    </script>

</body>

</html>
