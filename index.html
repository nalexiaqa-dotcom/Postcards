<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Postcards — Where will you go next?</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      background: #e8e1d5;
      color: #202020;
    }

    /* =========================
       BACKGROUND
    ========================= */

    .background {
      position: fixed;
      inset: 0;
      z-index: -2;

      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;

      transition:
        background-image 1.2s ease,
        transform 1.5s ease;

      transform: scale(1.02);
    }

    .background::after {
      content: "";
      position: absolute;
      inset: 0;

      background:
        linear-gradient(
          rgba(0, 0, 0, 0.08),
          rgba(0, 0, 0, 0.16)
        );
    }

    /* =========================
       MAIN PAGE
    ========================= */

    .page {
      width: 100%;
      height: 100vh;

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 30px;
    }

    /* =========================
       POSTCARD
    ========================= */

    .postcard-wrapper {
      width: min(760px, 90vw);
      height: min(500px, 65vh);

      perspective: 1600px;

      cursor: pointer;
    }

    .postcard {
      position: relative;

      width: 100%;
      height: 100%;

      transform-style: preserve-3d;

      transition:
        transform 1.1s cubic-bezier(.2,.7,.2,1);

      border-radius: 4px;

      box-shadow:
        0 25px 60px rgba(0, 0, 0, 0.22);

      background: #f4efe5;
    }

    .postcard.flipped {
      transform: rotateY(180deg);
    }

    /* =========================
       BOTH SIDES
    ========================= */

    .postcard-front,
    .postcard-back {
      position: absolute;

      width: 100%;
      height: 100%;

      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;

      border-radius: 4px;

      overflow: hidden;
    }

    /* =========================
       FRONT
    ========================= */

    .postcard-front {
      display: flex;
      flex-direction: column;

      justify-content: space-between;

      padding: 42px;

      background:
        rgba(248, 245, 238, 0.94);

      border: 1px solid rgba(0, 0, 0, 0.08);
    }

    .brand {
      font-size: 13px;
      font-weight: 700;

      letter-spacing: 0.28em;

      text-transform: uppercase;
    }

    .front-center {
      max-width: 600px;
    }

    .front-center h1 {
      font-family: Georgia, "Times New Roman", serif;

      font-size: clamp(45px, 7vw, 82px);

      line-height: 0.94;

      font-weight: 400;

      letter-spacing: -0.045em;

      text-transform: uppercase;
    }

    .front-bottom {
      display: flex;

      justify-content: space-between;
      align-items: flex-end;
    }

    .edition {
      font-size: 11px;

      text-transform: uppercase;

      letter-spacing: 0.18em;

      opacity: 0.65;
    }

    .flip-hint {
      font-size: 11px;

      text-transform: uppercase;

      letter-spacing: 0.16em;

      opacity: 0.7;
    }

    /* =========================
       BACK
    ========================= */

    .postcard-back {
      transform: rotateY(180deg);

      display: grid;

      grid-template-columns: 1fr 1fr;

      background: #f4efe5;
    }

    .back-left {
      padding: 45px;

      display: flex;
      flex-direction: column;

      justify-content: space-between;

      border-right: 1px solid rgba(0, 0, 0, 0.12);
    }

    .back-left h2 {
      font-family: Georgia, "Times New Roman", serif;

      font-size: clamp(38px, 5vw, 62px);

      font-weight: 400;

      line-height: 0.95;

      letter-spacing: -0.04em;
    }

    .back-left p {
      max-width: 320px;

      font-size: 14px;

      line-height: 1.6;

      color: #555;
    }

    .back-right {
      padding: 45px;

      display: flex;

      flex-direction: column;

      justify-content: center;

      gap: 16px;
    }

    .auth-button {
      width: 100%;

      padding: 16px 20px;

      border: 1px solid #222;

      background: transparent;

      color: #222;

      font-size: 12px;

      font-weight: 700;

      text-transform: uppercase;

      letter-spacing: 0.16em;

      cursor: pointer;

      transition: all 0.25s ease;
    }

    .auth-button:hover {
      background: #222;

      color: #f4efe5;
    }

    .auth-button.primary {
      background: #222;

      color: #f4efe5;
    }

    .auth-button.primary:hover {
      background: transparent;

      color: #222;
    }

    .back-small {
      margin-top: 15px;

      font-size: 10px;

      text-align: center;

      text-transform: uppercase;

      letter-spacing: 0.12em;

      opacity: 0.55;
    }

    /* =========================
       RESPONSIVE
    ========================= */

    @media (max-width: 700px) {

      .page {
        padding: 18px;
      }

      .postcard-wrapper {
        width: 94vw;
        height: 62vh;
      }

      .postcard-front {
        padding: 28px;
      }

      .front-center h1 {
        font-size: clamp(42px, 12vw, 65px);
      }

      .postcard-back {
        grid-template-columns: 1fr;
      }

      .back-left {
        padding: 28px;

        border-right: none;

        border-bottom: 1px solid rgba(0, 0, 0, 0.12);
      }

      .back-right {
        padding: 28px;
      }

      .back-left h2 {
        font-size: 40px;
      }
    }

    @media (max-height: 650px) {

      .postcard-wrapper {
        height: 80vh;
      }

      .postcard-front,
      .back-left,
      .back-right {
        padding: 25px;
      }
    }
  </style>
</head>

<body>

  <!-- =========================
       CHANGING BACKGROUND
  ========================= -->

  <div class="background" id="background"></div>


  <!-- =========================
       PAGE
  ========================= -->

  <main class="page">

    <div
      class="postcard-wrapper"
      id="postcardWrapper"
      role="button"
      tabindex="0"
      aria-label="Open Postcards"
    >

      <div class="postcard" id="postcard">

        <!-- =====================
             FRONT OF POSTCARD
        ====================== -->

        <section class="postcard-front">

          <div class="brand">
            POSTCARDS
          </div>


          <div class="front-center">

            <h1>
              Where will<br>
              you go next?
            </h1>

          </div>


          <div class="front-bottom">

            <div class="edition">
              A guide to your next chapter
            </div>

            <div class="flip-hint">
              Tap to explore →
            </div>

          </div>

        </section>


        <!-- =====================
             BACK OF POSTCARD
        ====================== -->

        <section class="postcard-back">

          <div class="back-left">

            <div>
              <div class="brand">
                POSTCARDS
              </div>

              <h2>
                Let's<br>
                find out.
              </h2>
            </div>


            <p>
              Discover universities around the world,
              explore your possibilities, and find the
              place that could become your next chapter.
            </p>

          </div>


          <div class="back-right">

            <button
              class="auth-button primary"
              onclick="goToLogin(event)"
            >
              Log in
            </button>

            <button
              class="auth-button"
              onclick="goToSignup(event)"
            >
              Sign up
            </button>

            <div class="back-small">
              Your journey starts here.
            </div>

          </div>

        </section>

      </div>

    </div>

  </main>


  <script>

    /* =========================
       CHANGING BACKGROUNDS
    ========================= */

    const backgrounds = [

      "https://images.unsplash.com/photo-1502602898657-3e91760cbb34?auto=format&fit=crop&w=2000&q=85",

      "https://images.unsplash.com/photo-1523482580672-f109ba8cb9be?auto=format&fit=crop&w=2000&q=85",

      "https://images.unsplash.com/photo-1530789253388-582c481c54b0?auto=format&fit=crop&w=2000&q=85",

      "https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=2000&q=85",

      "https://images.unsplash.com/photo-1467269204594-9661b134dd2b?auto=format&fit=crop&w=2000&q=85"

    ];

    const background = document.getElementById("background");

    let currentBackground = 0;


    function changeBackground() {

      background.style.backgroundImage =
        `url("${backgrounds[currentBackground]}")`;

      currentBackground =
        (currentBackground + 1) % backgrounds.length;

    }


    changeBackground();

    setInterval(changeBackground, 6000);


    /* =========================
       POSTCARD FLIP
    ========================= */

    const wrapper =
      document.getElementById("postcardWrapper");

    const postcard =
      document.getElementById("postcard");


    function flipPostcard() {

      postcard.classList.toggle("flipped");

    }


    wrapper.addEventListener("click", function(event) {

      /*
        Don't flip when the user clicks
        one of the authentication buttons.
      */

      if (
        event.target.closest(".auth-button")
      ) {
        return;
      }

      flipPostcard();

    });


    /* Keyboard accessibility */

    wrapper.addEventListener("keydown", function(event) {

      if (
        event.key === "Enter" ||
        event.key === " "
      ) {

        event.preventDefault();

        flipPostcard();

      }

    });


    /* =========================
       NAVIGATION
    ========================= */

    function goToLogin(event) {

      event.stopPropagation();

      window.location.href = "login.html";

    }


    function goToSignup(event) {

      event.stopPropagation();

      window.location.href = "signup.html";

    }

  </script>

</body>
</html>
