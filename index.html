<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Postcards — Your Dream University</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Georgia, 'Times New Roman', serif;
            height: 100vh;
            overflow: hidden;
            color: #3d3530;
        }

        /* =========================
           WORLD BACKGROUND
        ========================= */

        .world {
            position: fixed;
            inset: 0;
            background-size: cover;
            background-position: center;
            transition: background-image 1.8s ease-in-out;
        }

        .world::after {
            content: "";
            position: absolute;
            inset: 0;
            background: rgba(35, 30, 27, 0.28);
            backdrop-filter: blur(1px);
        }


        /* =========================
           MAIN SCREEN
        ========================= */

        .screen {
            position: relative;
            z-index: 2;
            width: 100%;
            height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 30px;
        }


        /* =========================
           POSTCARD CONTAINER
        ========================= */

        .postcard-wrapper {
            width: min(620px, 88vw);
            aspect-ratio: 1.55 / 1;

            perspective: 1500px;

            cursor: pointer;

            filter:
                drop-shadow(0 25px 35px rgba(0,0,0,0.35));

            animation: postcardEntrance 1.4s ease forwards;
        }

        .postcard {
            width: 100%;
            height: 100%;

            position: relative;

            transform-style: preserve-3d;

            transition:
                transform 1.1s cubic-bezier(.68,-0.15,.25,1.15);
        }

        .postcard.flipped {
            transform: rotateY(180deg);
        }


        /* =========================
           BOTH SIDES
        ========================= */

        .postcard-side {
            position: absolute;
            inset: 0;

            width: 100%;
            height: 100%;

            border-radius: 5px;

            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;

            overflow: hidden;
        }


        /* =========================
           FRONT OF POSTCARD
        ========================= */

        .front {
            background:
                linear-gradient(
                    rgba(255, 249, 238, 0.08),
                    rgba(255, 249, 238, 0.08)
                ),
                #f7ead7;

            border: 9px solid #fffaf1;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            text-align: center;

            position: relative;
        }

        /* Vintage paper texture */

        .front::before,
        .back::before {
            content: "";
            position: absolute;
            inset: 0;

            background-image:
                radial-gradient(
                    rgba(80, 60, 45, 0.10) 0.7px,
                    transparent 0.7px
                );

            background-size: 5px 5px;

            opacity: 0.25;

            pointer-events: none;
        }

        .front-content {
            position: relative;
            z-index: 2;

            padding: 35px;
        }

        .brand {
            font-family: Arial, sans-serif;

            font-size: clamp(15px, 2vw, 20px);

            letter-spacing: 5px;

            margin-bottom: 25px;

            color: #6d5b4f;
        }

        .front h1 {
            font-size: clamp(34px, 6vw, 62px);

            line-height: 1.02;

            font-weight: normal;

            max-width: 520px;

            color: #41362f;
        }

        .front-subtitle {
            margin-top: 22px;

            font-family: Arial, sans-serif;

            font-size: 12px;

            letter-spacing: 3px;

            text-transform: uppercase;

            color: #806c5d;
        }

        /* Postcard decorative lines */

        .stamp {
            position: absolute;

            top: 20px;
            right: 20px;

            width: 70px;
            height: 85px;

            border: 2px dashed #a98e78;

            display: flex;
            align-items: center;
            justify-content: center;

            font-family: Arial, sans-serif;

            font-size: 10px;

            letter-spacing: 1px;

            color: #806c5d;

            transform: rotate(3deg);
        }

        .airmail {
            position: absolute;

            bottom: 16px;
            left: 18px;
            right: 18px;

            height: 5px;

            background:
                repeating-linear-gradient(
                    90deg,
                    #9c6f61 0 18px,
                    transparent 18px 28px,
                    #8a7385 28px 46px,
                    transparent 46px 56px
                );

            opacity: 0.65;
        }


        /* =========================
           BACK OF POSTCARD
        ========================= */

        .back {
            background: #f8eee0;

            border: 9px solid #fffaf1;

            transform: rotateY(180deg);

            padding: 35px;

            display: flex;

            align-items: center;

            justify-content: center;
        }

        .back-content {
            position: relative;
            z-index: 2;

            width: 100%;
            max-width: 470px;

            text-align: center;
        }

        .back h2 {
            font-size: clamp(30px, 5vw, 48px);

            font-weight: normal;

            margin-bottom: 8px;
        }

        .back-description {
            font-family: Arial, sans-serif;

            font-size: 13px;

            letter-spacing: 1px;

            color: #76665b;

            margin-bottom: 25px;
        }


        /* =========================
           INPUTS
        ========================= */

        .input {
            width: 100%;

            padding: 14px 15px;

            margin-bottom: 12px;

            border: none;

            border-bottom: 1px solid #bba695;

            background: transparent;

            outline: none;

            font-family: Arial, sans-serif;

            font-size: 14px;

            color: #403731;
        }

        .input:focus {
            border-bottom: 1px solid #806a5c;
        }


        /* =========================
           BUTTONS
        ========================= */

        .primary-button {
            width: 100%;

            padding: 14px;

            margin-top: 8px;

            border: none;

            background: #4c4038;

            color: #fffaf3;

            font-family: Arial, sans-serif;

            font-size: 12px;

            letter-spacing: 3px;

            cursor: pointer;

            transition: 0.3s;
        }

        .primary-button:hover {
            background: #6b584c;

            transform: translateY(-2px);
        }

        .signup {
            margin-top: 18px;

            font-family: Arial, sans-serif;

            font-size: 12px;

            color: #75645a;
        }

        .signup button {
            border: none;

            background: none;

            text-decoration: underline;

            cursor: pointer;

            font-family: inherit;

            color: #4c4038;
        }


        /* =========================
           TAP MESSAGE
        ========================= */

        .tap-message {
            position: absolute;

            bottom: 25px;

            left: 50%;

            transform: translateX(-50%);

            z-index: 5;

            color: white;

            font-family: Arial, sans-serif;

            font-size: 11px;

            letter-spacing: 3px;

            text-transform: uppercase;

            opacity: 0.9;

            animation: pulse 2s infinite;
        }


        /* =========================
           LOCATION LABEL
        ========================= */

        .location {
            position: absolute;

            top: 25px;

            left: 30px;

            z-index: 5;

            color: white;

            font-family: Arial, sans-serif;

            font-size: 11px;

            letter-spacing: 3px;

            text-transform: uppercase;

            opacity: 0.9;
        }


        /* =========================
           ANIMATIONS
        ========================= */

        @keyframes postcardEntrance {

            from {
                opacity: 0;
                transform:
                    translateY(50px)
                    rotate(-3deg)
                    scale(0.92);
            }

            to {
                opacity: 1;
                transform:
                    translateY(0)
                    rotate(-1deg)
                    scale(1);
            }
        }

        @keyframes pulse {

            0%, 100% {
                opacity: 0.5;
            }

            50% {
                opacity: 1;
            }
        }


        /* =========================
           MOBILE / IPAD
        ========================= */

        @media (max-width: 600px) {

            .postcard-wrapper {
                width: 92vw;
            }

            .front-content {
                padding: 20px;
            }

            .stamp {
                width: 52px;
                height: 60px;

                font-size: 8px;

                top: 12px;
                right: 12px;
            }

            .back {
                padding: 20px;
            }

            .location {
                left: 20px;
                top: 18px;
            }
        }

    </style>
</head>


<body>

    <!-- WORLD BACKGROUND -->

    <div class="world" id="world"></div>


    <!-- CURRENT LOCATION -->

    <div class="location" id="location">
        Paris, France
    </div>


    <!-- MAIN -->

    <main class="screen">

        <div
            class="postcard-wrapper"
            id="postcardWrapper"
            onclick="flipPostcard()"
        >

            <div class="postcard" id="postcard">


                <!-- =====================
                     FRONT
                ====================== -->

                <section class="postcard-side front">

                    <div class="stamp">
                        POST<br>
                        CARDS
                    </div>

                    <div class="front-content">

                        <div class="brand">
                            POSTCARDS
                        </div>

                        <h1>
                            Welcome to<br>
                            your dream<br>
                            university.
                        </h1>

                        <div class="front-subtitle">
                            Your next chapter starts here
                        </div>

                    </div>

                    <div class="airmail"></div>

                </section>



                <!-- =====================
                     BACK
                ====================== -->

                <section class="postcard-side back">

                    <div class="back-content">

                        <h2>
                            Welcome.
                        </h2>

                        <p class="back-description">
                            Your journey starts with a postcard.
                        </p>


                        <input
                            class="input"
                            type="email"
                            placeholder="Email address"
                        >

                        <input
                            class="input"
                            type="password"
                            placeholder="Password"
                        >


                        <button
                            class="primary-button"
                            onclick="login(event)"
                        >
                            LOG IN
                        </button>


                        <div class="signup">

                            Don't have an account?

                            <button
                                onclick="signup(event)"
                            >
                                Create one
                            </button>

                        </div>

                    </div>

                </section>

            </div>

        </div>

    </main>


    <div class="tap-message" id="tapMessage">
        Tap the postcard to open
    </div>



    <script>

        /* =====================================
           DESTINATIONS
        ===================================== */

        const destinations = [

            {
                name: "Paris, France",

                image:
                "https://images.unsplash.com/photo-1502602898657-3e91760cbb34?auto=format&fit=crop&w=2000&q=85"
            },

            {
                name: "Tokyo, Japan",

                image:
                "https://images.unsplash.com/photo-1540959733332-eab4deabeeaf?auto=format&fit=crop&w=2000&q=85"
            },

            {
                name: "New York, USA",

                image:
                "https://images.unsplash.com/photo-1485871981521-5b1fd3805eee?auto=format&fit=crop&w=2000&q=85"
            },

            {
                name: "Barcelona, Spain",

                image:
                "https://images.unsplash.com/photo-1539037116277-4db20889f2d4?auto=format&fit=crop&w=2000&q=85"
            },

            {
                name: "Seoul, South Korea",

                image:
                "https://images.unsplash.com/photo-1538485399081-7c8979d1d5f1?auto=format&fit=crop&w=2000&q=85"
            }

        ];


        let currentDestination = 0;


        /* =====================================
           SET INITIAL BACKGROUND
        ===================================== */

        const world =
            document.getElementById("world");

        const locationText =
            document.getElementById("location");


        function changeDestination() {

            currentDestination++;

            if (
                currentDestination >=
                destinations.length
            ) {

                currentDestination = 0;

            }


            const destination =
                destinations[currentDestination];


            world.style.backgroundImage =
                `url("${destination.image}")`;


            locationText.textContent =
                destination.name;

        }


        world.style.backgroundImage =
            `url("${destinations[0].image}")`;


        /* Change destination every 7 seconds */

        setInterval(
            changeDestination,
            7000
        );



        /* =====================================
           POSTCARD FLIP
        ===================================== */

        function flipPostcard() {

            const postcard =
                document.getElementById("postcard");

            const tapMessage =
                document.getElementById("tapMessage");


            postcard.classList.toggle("flipped");


            if (
                postcard.classList.contains("flipped")
            ) {

                tapMessage.textContent =
                    "Tap to return";

            } else {

                tapMessage.textContent =
                    "Tap the postcard to open";

            }

        }



        /* =====================================
           LOGIN
        ===================================== */

        function login(event) {

            event.stopPropagation();

            alert(
                "Welcome to Postcards! ✈️\n\n" +
                "The login system will be connected later."
            );

        }



        /* =====================================
           SIGN UP
        ===================================== */

        function signup(event) {

            event.stopPropagation();

            alert(
                "Create your Postcards account!\n\n" +
                "The sign-up page will be added next."
            );

        }

    </script>

</body>
</html>
