<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Discover · Postcards</title>

  <link
    rel="stylesheet"
    href="css/postcards.css"
  >
</head>

<body>

  <!-- NAVIGATION -->

  <nav class="site-nav">

    <div class="nav-inner">

      <a
        href="index.html"
        class="logo"
      >
        Postcards
      </a>

      <div class="nav-links">

        <a
          href="discover.html"
          class="nav-link active"
        >
          Discover
        </a>

        <a
          href="saved.html"
          class="nav-link"
        >
          Saved
        </a>

        <a
          href="compare.html"
          class="nav-link"
        >
          Compare
        </a>

        <a
          href="tracker.html"
          class="nav-link"
        >
          Tracker
        </a>

        <a
          href="learn.html"
          class="nav-link"
        >
          Learn
        </a>

      </div>

      <a
        href="account.html"
        class="nav-profile"
      >
        P
      </a>

    </div>

  </nav>


  <!-- MAIN CONTENT -->

  <main class="main-content">

    <div class="page-shell">


      <!-- HEADER -->

      <header class="page-header">

        <div class="eyebrow">
          Your university journey
        </div>

        <h1 class="display">
          Discover your next place.
        </h1>

        <p>
          Explore universities, compare your options,
          and find the places that feel right for your
          next chapter.
        </p>

      </header>


      <!-- SEARCH -->

      <div class="search-wrapper">

        <span
          class="search-icon"
          aria-hidden="true"
        >
          ⌕
        </span>

        <input
          type="search"
          id="universitySearch"
          class="search-input"
          placeholder="Search universities, cities, majors..."
          autocomplete="off"
        >

      </div>


      <!-- FILTERS -->

      <div class="filters">

        <select
          id="locationFilter"
          class="filter-select"
        >
          <option value="">
            Location
          </option>
        </select>


        <select
          id="majorFilter"
          class="filter-select"
        >
          <option value="">
            Major
          </option>
        </select>


        <select
          id="tuitionFilter"
          class="filter-select"
        >
          <option value="">
            Tuition
          </option>

          <option value="under-40000">
            Under $40k
          </option>

          <option value="40000-55000">
            $40k–$55k
          </option>

          <option value="55000-65000">
            $55k–$65k
          </option>

          <option value="over-65000">
            Over $65k
          </option>
        </select>


        <select
          id="typeFilter"
          class="filter-select"
        >
          <option value="">
            School type
          </option>

          <option value="Private">
            Private
          </option>

          <option value="Public">
            Public
          </option>
        </select>


        <select
          id="internationalFilter"
          class="filter-select"
        >
          <option value="">
            International
          </option>

          <option value="yes">
            Welcomes international students
          </option>

        </select>


        <button
          id="resetFilters"
          class="filter-reset"
        >
          Clear all
        </button>

      </div>


      <!-- QUICK SEARCHES -->

      <section class="quick-section">

        <div class="section-label">
          Explore by interest
        </div>

        <div class="quick-chips">

          <button
            class="quick-chip"
            data-query="New York"
          >
            New York
          </button>

          <button
            class="quick-chip"
            data-query="Computer Science"
          >
            Computer Science
          </button>

          <button
            class="quick-chip"
            data-query="Business"
          >
            Business
          </button>

          <button
            class="quick-chip"
            data-query="Technology"
          >
            Technology
          </button>

          <button
            class="quick-chip"
            data-query="Under $40k"
          >
            Under $40k
          </button>

        </div>

      </section>


      <!-- RECOMMENDED -->

      <section
        class="discovery-section"
        id="recommendedSection"
      >

        <div class="section-heading">

          <div>

            <div class="section-label">
              For you
            </div>

            <h2>
              Recommended for you
            </h2>

          </div>

        </div>


        <div
          class="university-grid"
          id="recommendedGrid"
        ></div>

      </section>


      <!-- ALL UNIVERSITIES -->

      <section class="discovery-section">

        <div class="section-heading">

          <div>

            <div class="section-label">
              Explore
            </div>

            <h2>
              All universities
            </h2>

          </div>

          <span
            class="results-count"
            id="resultsCount"
          >
            0 universities
          </span>

        </div>


        <div
          class="university-grid"
          id="universityGrid"
        ></div>

      </section>

    </div>

  </main>


  <!-- JAVASCRIPT -->

  <script src="js/universities.js"></script>

  <script src="js/app.js"></script>

  <script src="js/discover.js"></script>

</body>

</html>
