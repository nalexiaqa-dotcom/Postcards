<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">

<title>Postcards — Discover</title>

<style>

/* =====================================================
   RESET
===================================================== */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    min-height: 100vh;
    font-family: Arial, Helvetica, sans-serif;
    color: #272522;
    background: #e8e4dc;
    overflow-x: hidden;
}


/* =====================================================
   CHANGING BACKGROUND
===================================================== */

.background {
    position: fixed;
    inset: 0;
    z-index: -10;

    background:
        linear-gradient(
            120deg,
            #dcd8cf,
            #eeeae2,
            #d5ddd9
        );

    background-size: 300% 300%;

    animation:
        backgroundMove 18s ease infinite;
}

.background::after {
    content: "";
    position: absolute;
    inset: 0;

    background:
        radial-gradient(
            circle at 20% 20%,
            rgba(255,255,255,.55),
            transparent 30%
        ),
        radial-gradient(
            circle at 80% 80%,
            rgba(120,120,110,.12),
            transparent 35%
        );
}

@keyframes backgroundMove {

    0% {
        background-position: 0% 50%;
    }

    50% {
        background-position: 100% 50%;
    }

    100% {
        background-position: 0% 50%;
    }

}


/* =====================================================
   HEADER
===================================================== */

.header {
    position: sticky;
    top: 0;
    z-index: 50;

    height: 72px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 42px;

    background: rgba(245,243,238,.82);

    backdrop-filter: blur(18px);

    border-bottom:
        1px solid
        rgba(39,37,34,.12);
}

.logo {
    font-size: 13px;
    font-weight: 600;

    letter-spacing: 5px;

    color: #272522;
}

.header-right {
    display: flex;
    align-items: center;
    gap: 25px;
}

.profile {
    font-size: 9px;
    letter-spacing: 2px;
    text-transform: uppercase;

    color: #77736c;
}


/* =====================================================
   MAIN
===================================================== */

.main {
    width: min(1380px, 92vw);

    margin: 0 auto;

    padding:
        65px 0 100px;
}


/* =====================================================
   INTRO
===================================================== */

.intro {
    display: grid;

    grid-template-columns:
        1.3fr
        .7fr;

    gap: 70px;

    align-items: end;

    margin-bottom: 55px;
}

.eyebrow {
    font-size: 9px;

    letter-spacing: 4px;

    text-transform: uppercase;

    color: #77736c;

    margin-bottom: 17px;
}

.intro h1 {
    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-size:
        clamp(
            52px,
            7vw,
            92px
        );

    font-weight: normal;

    line-height: .92;

    letter-spacing: -3px;

    color: #272522;
}

.intro-text {
    max-width: 390px;

    font-size: 12px;

    line-height: 1.8;

    color: #68645e;
}


/* =====================================================
   DIVIDER
===================================================== */

.section-line {
    width: 100%;

    height: 1px;

    background:
        rgba(39,37,34,.15);

    margin-bottom: 25px;
}


/* =====================================================
   SEARCH AREA
===================================================== */

.search-area {
    display: grid;

    grid-template-columns:
        1fr
        auto
        auto;

    gap: 9px;

    margin-bottom: 14px;
}

.search-box {
    position: relative;
}

.search-box input {
    width: 100%;

    height: 54px;

    padding:
        0 18px;

    border:
        1px solid
        rgba(39,37,34,.2);

    outline: none;

    background:
        rgba(250,249,245,.72);

    font-size: 12px;

    color: #272522;

    transition:
        border .2s ease,
        background .2s ease;
}

.search-box input:focus {
    border-color:
        #272522;

    background:
        rgba(255,255,255,.9);
}

.search-box input::placeholder {
    color: #96918a;
}

.control-button {
    height: 54px;

    padding:
        0 21px;

    border:
        1px solid
        rgba(39,37,34,.2);

    background:
        rgba(250,249,245,.72);

    color: #4f4b45;

    font-size: 9px;

    letter-spacing: 2px;

    text-transform: uppercase;

    cursor: pointer;

    transition:
        .2s ease;
}

.control-button:hover,
.control-button.active {
    background: #272522;
    color: white;
}


/* =====================================================
   FILTERS
===================================================== */

.filters {
    display: flex;

    flex-wrap: wrap;

    gap: 7px;

    margin-bottom: 48px;
}

.filter {
    border:
        1px solid
        rgba(39,37,34,.18);

    background:
        rgba(250,249,245,.45);

    padding:
        9px 13px;

    font-size: 8px;

    letter-spacing: 1.5px;

    text-transform: uppercase;

    color: #6e6962;

    cursor: pointer;

    transition:
        .2s ease;
}

.filter:hover,
.filter.active {
    background: #272522;

    border-color: #272522;

    color: white;
}


/* =====================================================
   RESULTS HEADER
===================================================== */

.results-header {
    display: flex;

    align-items: center;

    justify-content: space-between;

    margin-bottom: 17px;
}

.results-title {
    font-size: 9px;

    letter-spacing: 3px;

    text-transform: uppercase;

    color: #5e5952;
}

.result-count {
    font-size: 9px;

    letter-spacing: 1px;

    color: #8b867e;
}


/* =====================================================
   UNIVERSITY GRID
===================================================== */

.grid {
    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 17px;
}


/* =====================================================
   UNIVERSITY CARD
===================================================== */

.university-card {
    position: relative;

    background:
        rgba(248,247,243,.86);

    border:
        1px solid
        rgba(39,37,34,.13);

    overflow: hidden;

    cursor: pointer;

    transition:
        transform .35s ease,
        box-shadow .35s ease,
        background .35s ease;
}

.university-card:hover {
    transform:
        translateY(-7px);

    background:
        rgba(255,255,255,.96);

    box-shadow:
        0 25px 50px
        rgba(35,32,28,.15);
}


/* =====================================================
   IMAGE
===================================================== */

.card-image {
    height: 190px;

    position: relative;

    background-size: cover;

    background-position: center;

    overflow: hidden;
}

.card-image::after {
    content: "";

    position: absolute;

    inset: 0;

    background:
        linear-gradient(
            to bottom,
            rgba(0,0,0,.02),
            rgba(0,0,0,.45)
        );
}

.card-country {
    position: absolute;

    left: 17px;

    bottom: 15px;

    z-index: 2;

    font-size: 8px;

    letter-spacing: 2px;

    text-transform: uppercase;

    color: white;
}


/* =====================================================
   SAVE
===================================================== */

.save-button {
    position: absolute;

    top: 13px;
    right: 13px;

    z-index: 10;

    width: 34px;
    height: 34px;

    border: none;

    border-radius: 50%;

    background:
        rgba(250,249,245,.92);

    color: #393631;

    font-size: 16px;

    cursor: pointer;

    transition:
        transform .2s ease,
        background .2s ease;
}

.save-button:hover {
    transform: scale(1.08);
}

.save-button.saved {
    background: #272522;
    color: white;
}


/* =====================================================
   MATCH
===================================================== */

.match {
    position: absolute;

    top: 174px;
    left: 16px;

    z-index: 5;

    padding:
        6px 9px;

    background:
        #f7f5ef;

    font-size: 8px;

    letter-spacing: 1px;

    color: #4f4b45;
}


/* =====================================================
   CARD CONTENT
===================================================== */

.card-content {
    padding:
        21px 19px 20px;
}

.card-kicker {
    font-size: 8px;

    letter-spacing: 2px;

    text-transform: uppercase;

    color: #89847c;

    margin-bottom: 8px;
}

.card-title {
    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-size: 25px;

    font-weight: normal;

    line-height: 1.05;

    color: #292723;

    margin-bottom: 7px;
}

.card-location {
    font-size: 10px;

    color: #77726a;

    margin-bottom: 17px;
}


/* =====================================================
   TAGS
===================================================== */

.tags {
    display: flex;

    flex-wrap: wrap;

    gap: 5px;

    margin-bottom: 17px;
}

.tag {
    padding:
        5px 7px;

    background:
        rgba(39,37,34,.06);

    font-size: 7px;

    letter-spacing: .7px;

    color: #68635d;
}


/* =====================================================
   CARD INFO
===================================================== */

.card-info {
    display: grid;

    grid-template-columns:
        1fr
        1fr;

    gap: 10px;

    padding-top: 13px;

    border-top:
        1px solid
        rgba(39,37,34,.13);
}

.info-item {
    font-size: 8px;

    line-height: 1.5;

    color: #817b73;
}

.info-item strong {
    display: block;

    font-size: 7px;

    letter-spacing: 1px;

    color: #4d4943;

    margin-bottom: 2px;
}


/* =====================================================
   EMPTY
===================================================== */

.empty {
    grid-column: 1 / -1;

    padding:
        100px 20px;

    text-align: center;

    background:
        rgba(250,249,245,.65);

    border:
        1px dashed
        rgba(39,37,34,.25);
}

.empty h2 {
    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-size: 38px;

    font-weight: normal;

    margin-bottom: 12px;
}

.empty p {
    max-width: 430px;

    margin:
        0 auto 22px;

    font-size: 11px;

    line-height: 1.7;

    color: #77726a;
}


/* =====================================================
   MODAL
===================================================== */

.modal {
    position: fixed;

    inset: 0;

    z-index: 100;

    display: none;

    align-items: center;

    justify-content: center;

    padding: 25px;

    background:
        rgba(28,26,23,.62);

    backdrop-filter:
        blur(12px);
}

.modal.active {
    display: flex;
}

.modal-card {
    position: relative;

    width:
        min(
            820px,
            95vw
        );

    max-height:
        90vh;

    overflow-y: auto;

    padding:
        40px;

    background:
        #f5f2eb;

    border:
        1px solid
        rgba(255,255,255,.5);

    box-shadow:
        0 35px 80px
        rgba(0,0,0,.35);
}

.close {
    position: absolute;

    top: 17px;
    right: 20px;

    border: none;

    background: none;

    font-size: 25px;

    color: #514c45;

    cursor: pointer;
}

.modal-eyebrow {
    font-size: 8px;

    letter-spacing: 3px;

    text-transform: uppercase;

    color: #8a847c;

    margin-bottom: 11px;
}

.modal-title {
    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-size:
        clamp(
            38px,
            6vw,
            65px
        );

    font-weight: normal;

    line-height: .95;

    letter-spacing: -2px;

    margin-bottom: 9px;
}

.modal-location {
    font-size: 11px;

    color: #77726a;

    margin-bottom: 27px;
}

.modal-description {
    max-width: 680px;

    font-size: 12px;

    line-height: 1.8;

    color: #5f5a53;

    margin-bottom: 27px;
}

.modal-grid {
    display: grid;

    grid-template-columns:
        repeat(2, 1fr);

    gap: 9px;
}

.modal-info {
    padding: 16px;

    border:
        1px solid
        rgba(39,37,34,.15);

    background:
        rgba(255,255,255,.35);
}

.modal-info span {
    display: block;

    font-size: 7px;

    letter-spacing: 2px;

    text-transform: uppercase;

    color: #8b857d;

    margin-bottom: 6px;
}

.modal-info strong {
    font-size: 10px;

    line-height: 1.5;

    color: #403c36;
}


/* =====================================================
   RESPONSIVE
===================================================== */

@media (max-width: 1050px) {

    .grid {
        grid-template-columns:
            repeat(2, 1fr);
    }

    .intro {
        grid-template-columns:
            1fr;
    }

    .intro-text {
        justify-self: start;
    }

}


@media (max-width: 680px) {

    .header {
        padding:
            0 20px;
    }

    .main {
        width: 90vw;

        padding-top: 45px;
    }

    .intro h1 {
        font-size: 54px;

        letter-spacing: -2px;
    }

    .search-area {
        grid-template-columns:
            1fr;
    }

    .grid {
        grid-template-columns:
            1fr;
    }

    .modal-card {
        padding:
            30px 21px;
    }

    .modal-grid {
        grid-template-columns:
            1fr;
    }

}


/* =====================================================
   SUBTLE SCROLLBAR
===================================================== */

::-webkit-scrollbar {
    width: 7px;
}

::-webkit-scrollbar-track {
    background: #e8e5de;
}

::-webkit-scrollbar-thumb {
    background: #aaa59d;
}

</style>

/* =====================================================

===================================================== */

function normalize(value) {

    return String(value || "")
        .toLowerCase()
        .normalize("NFD")
        .replace(
            /[\u0300-\u036f]/g,
            ""
        );

}

   MATCH SCORE
===================================================== */

function getMatchScore(university) {

    let score = 0;

    let possible = 0;


    /* FIELD */

    if (
        onboarding.study &&
        onboarding.study.length
    ) {

        possible += 3;

        const studies =
            onboarding.study.map(normalize);

        if (
            university.fields.some(
                field =>
                studies.includes(
                    normalize(field)
                )
            )
        ) {

            score += 3;

        }

    }


    /* COUNTRY */

    if (
        onboarding.countries &&
        onboarding.countries.length
    ) {

        possible += 3;

        const countries =
            onboarding.countries.map(
                normalize
            );

        if (
            countries.includes(
                normalize(
                    university.country
                )
            )
        ) {

            score += 3;

        }

    }


    /* ENVIRONMENT */

    if (
        onboarding.environment &&
        onboarding.environment.length
    ) {

        possible += 2;

        const preferred =
            onboarding.environment.map(
                normalize
            );

        if (
            university.environment.some(
                item =>
                preferred.includes(
                    normalize(item)
                )
            )
        ) {

            score += 2;

        }

    }


    /* PRIORITIES */

    if (
        onboarding.priorities &&
        onboarding.priorities.length
    ) {

        const priorities =
            onboarding.priorities.map(
                normalize
            );

        possible += 2;

        if (
            priorities.includes(
                "scholarships"
            ) &&
            university.scholarships
        ) {

            score += 1;

        }

        if (
            priorities.includes(
                "location"
            )
        ) {

            score += 1;

        }

    }


    if (!possible) {

        return 70;

    }


    return Math.round(
        (
            score /
            possible
        ) * 100
    );

}


/* =====================================================
   SEARCH
===================================================== */

function matchesSearch(
    university,
    query
) {

    if (!query.trim()) {
        return true;
    }

    const searchable = [

        university.name,
        university.country,
        university.city,
        university.type,
        university.climate,
        university.international,
        university.scholarships,
        university.cost,

        ...university.fields,
        ...university.environment,
        ...university.keywords

    ]
    .map(normalize)
    .join(" ");


    const words =
        normalize(query)
        .split(/\s+/)
        .filter(Boolean);


    return words.every(
        word =>
        searchable.includes(word)
    );

}


/* =====================================================
   FILTER
===================================================== */

function matchesFilter(
    university
) {

    if (
        activeFilter === "all"
    ) {

        return true;

    }


    if (
        activeFilter === "warm"
    ) {

        return university.climate === "warm";

    }


    if (
        activeFilter === "cold"
    ) {

        return university.climate === "cold";

    }


    if (
        activeFilter === "city"
    ) {

        return university.environment.includes(
            "Big city"
        );

    }


    return university.fields.includes(
        activeFilter
    );

}


/* =====================================================
   RESULTS
===================================================== */

function getResults() {

    let results =
        universities.filter(
            university =>
            matchesSearch(
                university,
                searchInput.value
            ) &&
            matchesFilter(
                university
            )
        );


    if (recommendedMode) {

        results.sort(
            (a,b) =>
            getMatchScore(b) -
            getMatchScore(a)
        );

    }


    return results;

}


/* =====================================================
   RENDER
===================================================== */

function render() {

    const results =
        getResults();


    grid.innerHTML = "";


    resultCount.textContent =
        `${results.length} ${
            results.length === 1
            ? "result"
            : "results"
        }`;


    if (!results.length) {

        grid.innerHTML = `

            <div class="empty">

                <h2>
                    Nothing here yet.
                </h2>

                <p>
                    Try another country,
                    city, university or field.
                    Your next postcard might
                    be somewhere unexpected.
                </p>

                <button
                    class="control-button"
                    onclick="resetEverything()"
                >
                    SHOW ALL
                </button>

            </div>

        `;

        return;

    }


    results.forEach(
        university => {

            const card =
                document.createElement(
                    "article"
                );

            card.className =
                "university-card";


            const score =
                getMatchScore(
                    university
                );


            const isSaved =
                savedUniversities.includes(
                    university.name
                );


            card.innerHTML = `

                <button
                    class="save-button ${
                        isSaved
                        ? "saved"
                        : ""
                    }"
                    aria-label="Save university"
                >
                    ${
                        isSaved
                        ? "♥"
                        : "♡"
                    }
                </button>


                <div
                    class="card-image"
                    style="
                        background-image:
                        url('${university.image}')
                    "
                >

                    <div class="card-country">
                        ${university.country}
                    </div>

                </div>


                ${
                    recommendedMode
                    ? `
                        <div class="match">
                            ${score}% MATCH
                        </div>
                    `
                    : ""
                }


                <div class="card-content">

                    <div class="card-kicker">
                        ${university.type}
                    </div>

                    <h2 class="card-title">
                        ${university.name}
                    </h2>

                    <div class="card-location">
                        ${university.city},
                        ${university.country}
                    </div>


                    <div class="tags">

                        ${university.fields
                            .slice(0,3)
                            .map(
                                field => `
                                    <span class="tag">
                                        ${field
                                            .replace(
                                                " & Economics",
                                                ""
                                            )
                                            .replace(
                                                " & Technology",
                                                ""
                                            )}
                                    </span>
                                `
                            )
                            .join("")
                        }

                    </div>


                    <div class="card-info">

                        <div class="info-item">

                            <strong>
                                CLIMATE
                            </strong>

                            ${university.climate}

                        </div>


                        <div class="info-item">

                            <strong>
                                INTERNATIONAL
                            </strong>

                            ${university.international}

                        </div>


                        <div class="info-item">

                            <strong>
                                SCHOLARSHIPS
                            </strong>

                            ${university.scholarships}

                        </div>


                        <div class="info-item">

                            <strong>
                                COST
                            </strong>

                            ${university.cost}

                        </div>

                    </div>

                </div>

            `;


            /* SAVE */

            const saveButton =
                card.querySelector(
                    ".save-button"
                );


            saveButton.addEventListener(
                "click",
                event => {

                    event.stopPropagation();

                    toggleSave(
                        university.name
                    );

                }
            );


            /* OPEN */

            card.addEventListener(
                "click",
                () => {

                    openUniversity(
                        university
                    );

                }
            );


            grid.appendChild(card);

        }
    );

}


/* =====================================================
   SAVE
===================================================== */

function toggleSave(
    universityName
) {

    if (
        savedUniversities.includes(
            universityName
        )
    ) {

        savedUniversities =
            savedUniversities.filter(
                name =>
                name !== universityName
            );

    } else {

        savedUniversities.push(
            universityName
        );

    }


    localStorage.setItem(
        "postcardsSavedUniversities",
        JSON.stringify(
            savedUniversities
        )
    );


    render();

}


/* =====================================================
   MODAL
===================================================== */

function openUniversity(
    university
) {

    document.getElementById(
        "modalEyebrow"
    ).textContent =
        university.type;


    document.getElementById(
        "modalTitle"
    ).textContent =
        university.name;


    document.getElementById(
        "modalLocation"
    ).textContent =
        `${university.city}, ${university.country}`;


    document.getElementById(
        "modalDescription"
    ).textContent =
        university.description;


    const information = [

        [
            "FIELDS",
            university.fields.join(", ")
        ],

        [
            "CLIMATE",
            university.climate
        ],

        [
            "ENVIRONMENT",
            university.environment.join(", ")
        ],

        [
            "INTERNATIONAL",
            university.international
        ],

        [
            "SCHOLARSHIPS",
            university.scholarships
        ],

        [
            "COST",
            university.cost
        ],

        [
            "YOUR MATCH",
            `${getMatchScore(university)}%`
        ],

        [
            "TYPE",
            university.type
        ]

    ];


    document.getElementById(
        "modalGrid"
    ).innerHTML =

        information
        .map(
            item => `

                <div class="modal-info">

                    <span>
                        ${item[0]}
                    </span>

                    <strong>
                        ${item[1]}
                    </strong>

                </div>

            `
        )
        .join("");


    modal.classList.add(
        "active"
    );

}


closeModal.addEventListener(
    "click",
    () => {

        modal.classList.remove(
            "active"
        );

    }
);


modal.addEventListener(
    "click",
    event => {

        if (
            event.target === modal
        ) {

            modal.classList.remove(
                "active"
            );

        }

    }
);


/* =====================================================
   FILTERS
===================================================== */

filters.forEach(
    filter => {

        filter.addEventListener(
            "click",
            () => {

                filters.forEach(
                    item =>
                    item.classList.remove(
                        "active"
                    )
                );


                filter.classList.add(
                    "active"
                );


                activeFilter =
                    filter.dataset.filter;


                render();

            }
        );

    }
);


/* =====================================================
   SEARCH
===================================================== */

searchInput.addEventListener(
    "input",
    render
);


/* =====================================================
   FOR ME
===================================================== */

recommendedButton.addEventListener(
    "click",
    () => {

        recommendedMode =
            !recommendedMode;


        recommendedButton.classList.toggle(
            "active",
            recommendedMode
        );


        recommendedButton.textContent =
            recommendedMode
            ? "FOR YOU"
            : "FOR ME";


        render();

    }
);


/* =====================================================
   RESET
===================================================== */

function resetEverything() {

    searchInput.value = "";

    activeFilter = "all";

    recommendedMode = false;


    filters.forEach(
        filter =>
        filter.classList.remove(
            "active"
        )
    );


    document
        .querySelector(
            '[data-filter="all"]'
        )
        .classList.add(
            "active"
        );


    recommendedButton.classList.remove(
        "active"
    );


    recommendedButton.textContent =
        "FOR ME";


    render();

}


resetButton.addEventListener(
    "click",
    resetEverything
);


/* =====================================================
   PROFILE
===================================================== */

if (
    onboarding.city
) {

    profileText.textContent =
        `${onboarding.city} • DISCOVER`;

}


/* =====================================================
   ESCAPE KEY
===================================================== */

document.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Escape"
        ) {

            modal.classList.remove(
                "active"
            );

        }

    }
);


/* =====================================================
   INITIAL
===================================================== */

render();

</script>

</body>
</html>
