<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Postcards — Discover</title>

<style>

/* =====================================================
   RESET
===================================================== */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    min-height: 100%;
}

body {

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    color: #40362f;

    background:
        #eee1d0;

    overflow-x: hidden;
}


/* =====================================================
   BACKGROUND
===================================================== */

.background {

    position: fixed;

    inset: 0;

    z-index: -10;

    background:
        linear-gradient(
            135deg,
            #e8d7c4,
            #f4eadf
        );
}

.background::before {

    content: "";

    position: absolute;

    inset: 0;

    background-image:
        radial-gradient(
            rgba(90,65,50,0.07)
            0.7px,
            transparent 0.7px
        );

    background-size: 5px 5px;

    opacity: .45;
}


/* =====================================================
   HEADER
===================================================== */

.header {

    position: sticky;

    top: 0;

    z-index: 50;

    height: 76px;

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding:
        0 38px;

    background:
        rgba(
            251,
            240,
            223,
            0.92
        );

    backdrop-filter:
        blur(12px);

    border-bottom:
        1px solid
        rgba(110,85,65,.15);
}

.logo {

    font-family: Arial, sans-serif;

    font-size: 13px;

    letter-spacing: 5px;

    color: #40362f;
}

.header-right {

    display: flex;

    align-items: center;

    gap: 20px;
}

.profile {

    font-family: Arial, sans-serif;

    font-size: 10px;

    letter-spacing: 2px;

    color: #806e60;

    text-transform: uppercase;
}


/* =====================================================
   MAIN
===================================================== */

.main {

    width:
        min(
            1400px,
            94vw
        );

    margin:
        0 auto;

    padding:
        50px 0 80px;
}


/* =====================================================
   INTRO
===================================================== */

.intro {

    display: grid;

    grid-template-columns:
        1.3fr
        .7fr;

    gap: 50px;

    align-items: end;

    margin-bottom: 38px;
}

.eyebrow {

    font-family: Arial, sans-serif;

    font-size: 10px;

    letter-spacing: 4px;

    color: #9a806e;

    margin-bottom: 14px;

    text-transform: uppercase;
}

.intro h1 {

    font-size:
        clamp(
            42px,
            6vw,
            72px
        );

    font-weight: normal;

    line-height: .98;

    color: #40362f;
}

.intro-text {

    font-family: Arial, sans-serif;

    font-size: 13px;

    line-height: 1.7;

    color: #806e60;

    max-width: 400px;

    justify-self: end;
}


/* =====================================================
   SEARCH
===================================================== */

.search-area {

    display: grid;

    grid-template-columns:
        1fr
        auto
        auto;

    gap: 10px;

    margin-bottom: 20px;
}

.search-box {

    position: relative;
}

.search-box input {

    width: 100%;

    height: 52px;

    border:
        1px solid
        #cbb8a5;

    background:
        rgba(
            255,
            250,
            242,
            .72
        );

    padding:
        0 18px;

    outline: none;

    font-family: Arial, sans-serif;

    font-size: 13px;

    color: #40362f;
}

.search-box input:focus {

    border-color:
        #806e60;
}

.search-box input::placeholder {

    color:
        #a18e7e;
}

.control-button {

    height: 52px;

    padding:
        0 20px;

    border:
        1px solid
        #cbb8a5;

    background:
        rgba(
            255,
            250,
            242,
            .72
        );

    font-family: Arial, sans-serif;

    font-size: 10px;

    letter-spacing: 2px;

    text-transform: uppercase;

    color: #62544b;

    cursor: pointer;
}

.control-button:hover {

    background:
        #4c4038;

    color: white;
}


/* =====================================================
   FILTERS
===================================================== */

.filters {

    display: flex;

    flex-wrap: wrap;

    gap: 8px;

    margin-bottom: 35px;
}

.filter {

    border:
        1px solid
        #cbb8a5;

    background:
        rgba(
            255,
            250,
            242,
            .45
        );

    padding:
        9px 14px;

    font-family: Arial, sans-serif;

    font-size: 10px;

    letter-spacing: 1px;

    color: #806e60;

    cursor: pointer;

    transition:
        .2s ease;
}

.filter:hover,
.filter.active {

    background:
        #4c4038;

    color: white;

    border-color:
        #4c4038;
}


/* =====================================================
   RESULTS HEADER
===================================================== */

.results-header {

    display: flex;

    align-items: center;

    justify-content: space-between;

    margin-bottom: 18px;
}

.results-title {

    font-family: Arial, sans-serif;

    font-size: 10px;

    letter-spacing: 3px;

    text-transform: uppercase;

    color: #806e60;
}

.result-count {

    font-family: Arial, sans-serif;

    font-size: 10px;

    color: #9a806e;
}


/* =====================================================
   UNIVERSITY GRID
===================================================== */

.grid {

    display: grid;

    grid-template-columns:
        repeat(
            3,
            1fr
        );

    gap: 18px;
}


/* =====================================================
   UNIVERSITY CARD
===================================================== */

.university-card {

    position: relative;

    min-height: 405px;

    background:
        linear-gradient(
            135deg,
            #fbf0df,
            #f3e3cf
        );

    border:
        7px solid
        #fffaf2;

    box-shadow:
        0 18px 35px
        rgba(70,50,35,.14);

    overflow: hidden;

    transition:
        transform .3s ease,
        box-shadow .3s ease;
}

.university-card:hover {

    transform:
        translateY(-6px)
        rotate(-.3deg);

    box-shadow:
        0 25px 45px
        rgba(70,50,35,.22);
}


/* =====================================================
   CARD IMAGE
===================================================== */

.card-image {

    height: 145px;

    position: relative;

    background-size: cover;

    background-position: center;

    overflow: hidden;
}

.card-image::after {

    content: "";

    position: absolute;

    inset: 0;

    background:
        linear-gradient(
            transparent,
            rgba(40,30,25,.48)
        );
}

.card-country {

    position: absolute;

    left: 16px;

    bottom: 13px;

    z-index: 2;

    font-family: Arial, sans-serif;

    font-size: 9px;

    letter-spacing: 2px;

    text-transform: uppercase;

    color: white;
}


/* =====================================================
   SAVE
===================================================== */

.save-button {

    position: absolute;

    top: 13px;

    right: 13px;

    z-index: 10;

    width: 35px;

    height: 35px;

    border: none;

    border-radius: 50%;

    background:
        rgba(
            255,
            250,
            242,
            .9
        );

    color: #66554a;

    font-size: 17px;

    cursor: pointer;

    box-shadow:
        0 4px 12px
        rgba(0,0,0,.14);
}

.save-button.saved {

    background:
        #4c4038;

    color: white;
}


/* =====================================================
   CARD CONTENT
===================================================== */

.card-content {

    padding:
        20px 19px 19px;
}

.card-kicker {

    font-family: Arial, sans-serif;

    font-size: 9px;

    letter-spacing: 2px;

    color: #9a806e;

    text-transform: uppercase;

    margin-bottom: 7px;
}

.card-title {

    font-size: 25px;

    font-weight: normal;

    line-height: 1.05;

    color: #40362f;

    margin-bottom: 6px;
}

.card-location {

    font-family: Arial, sans-serif;

    font-size: 11px;

    color: #806e60;

    margin-bottom: 16px;
}


/* =====================================================
   TAGS
===================================================== */

.tags {

    display: flex;

    flex-wrap: wrap;

    gap: 5px;

    margin-bottom: 15px;
}

.tag {

    padding:
        5px 7px;

    background:
        rgba(
            180,
            150,
            125,
            .12
        );

    font-family: Arial, sans-serif;

    font-size: 8px;

    letter-spacing: .5px;

    color: #766358;
}


/* =====================================================
   CARD INFO
===================================================== */

.card-info {

    display: grid;

    grid-template-columns:
        1fr
        1fr;

    gap: 8px;

    border-top:
        1px solid
        #d8c6b4;

    padding-top: 12px;

    margin-top: 5px;
}

.info-item {

    font-family: Arial, sans-serif;

    font-size: 9px;

    line-height: 1.5;

    color: #8b7767;
}

.info-item strong {

    display: block;

    color: #54473e;

    font-size: 9px;

    margin-bottom: 2px;
}


/* =====================================================
   MATCH SCORE
===================================================== */

.match {

    position: absolute;

    top: 168px;

    left: 18px;

    padding:
        5px 9px;

    background:
        #fffaf2;

    font-family: Arial, sans-serif;

    font-size: 8px;

    letter-spacing: 1px;

    color: #66554a;

    box-shadow:
        0 3px 8px
        rgba(0,0,0,.12);
}


/* =====================================================
   EMPTY
===================================================== */

.empty {

    grid-column:
        1 / -1;

    padding:
        80px 20px;

    text-align: center;

    background:
        rgba(
            255,
            250,
            242,
            .55
        );

    border:
        1px dashed
        #c4af9b;
}

.empty h2 {

    font-size: 34px;

    font-weight: normal;

    margin-bottom: 10px;
}

.empty p {

    font-family: Arial, sans-serif;

    font-size: 12px;

    line-height: 1.6;

    color: #806e60;

    max-width: 430px;

    margin:
        0 auto 20px;
}


/* =====================================================
   DETAIL MODAL
===================================================== */

.modal {

    position: fixed;

    inset: 0;

    z-index: 100;

    display: none;

    align-items: center;

    justify-content: center;

    padding: 25px;

    background:
        rgba(
            45,
            35,
            29,
            .55
        );

    backdrop-filter:
        blur(7px);
}

.modal.active {

    display: flex;
}

.modal-card {

    width:
        min(
            780px,
            95vw
        );

    max-height:
        90vh;

    overflow-y: auto;

    background:
        #f8ecdc;

    border:
        8px solid
        #fffaf2;

    padding:
        35px;

    box-shadow:
        0 30px 70px
        rgba(0,0,0,.35);

    position: relative;
}

.close {

    position: absolute;

    top: 15px;

    right: 17px;

    border: none;

    background: none;

    font-size: 25px;

    color: #66554a;

    cursor: pointer;
}

.modal-eyebrow {

    font-family: Arial, sans-serif;

    font-size: 9px;

    letter-spacing: 3px;

    color: #9a806e;

    text-transform: uppercase;

    margin-bottom: 10px;
}

.modal-title {

    font-size:
        clamp(
            35px,
            6vw,
            58px
        );

    font-weight: normal;

    line-height: 1;

    margin-bottom: 8px;
}

.modal-location {

    font-family: Arial, sans-serif;

    font-size: 12px;

    color: #806e60;

    margin-bottom: 25px;
}

.modal-description {

    font-family: Arial, sans-serif;

    font-size: 13px;

    line-height: 1.7;

    color: #62544b;

    margin-bottom: 25px;
}

.modal-grid {

    display: grid;

    grid-template-columns:
        repeat(
            2,
            1fr
        );

    gap: 10px;
}

.modal-info {

    padding: 15px;

    border:
        1px solid
        #d2bdab;

    background:
        rgba(
            255,
            250,
            242,
            .45
        );
}

.modal-info span {

    display: block;

    font-family: Arial, sans-serif;

    font-size: 8px;

    letter-spacing: 2px;

    color: #9a806e;

    text-transform: uppercase;

    margin-bottom: 5px;
}

.modal-info strong {

    font-family: Arial, sans-serif;

    font-size: 11px;

    line-height: 1.5;

    color: #51443b;
}


/* =====================================================
   RESPONSIVE
===================================================== */

@media (max-width: 1000px) {

    .grid {

        grid-template-columns:
            repeat(
                2,
                1fr
            );
    }

    .intro {

        grid-template-columns:
            1fr;
    }

    .intro-text {

        justify-self: start;
    }
}


@media (max-width: 650px) {

    .header {

        padding:
            0 20px;
    }

    .main {

        width: 92vw;

        padding-top: 35px;
    }

    .search-area {

        grid-template-columns:
            1fr;
    }

    .grid {

        grid-template-columns:
            1fr;
    }

    .university-card {

        min-height: 390px;
    }

    .modal-card {

        padding:
            28px 20px;
    }

    .modal-grid {

        grid-template-columns:
            1fr;
    }
}

</style>

</head>

</main>



<!-- =====================================================

===================================================== -->

<div

        <p

        <div

    </div>

</div>

/* =====================================================
   ELEMENTS
===================================================== */

const grid =
document.getElementById(
    "universityGrid"
);

const searchInput =
document.getElementById(
    "searchInput"
);

const resultCount =
document.getElementById(
    "resultCount"
);

const resetButton =
document.getElementById(
    "resetButton"
);

const recommendedButton =
document.getElementById(
    "recommendedButton"
);

const filters =
document.querySelectorAll(
    ".filter"
);

const modal =
document.getElementById(
    "modal"
);

const closeModal =
document.getElementById(
    "closeModal"
);


/* =====================================================
   ONBOARDING DATA
===================================================== */

let onboarding = {};

const savedAnswers =
localStorage.getItem(
    "postcardsAnswers"
);

if (savedAnswers) {

    try {

        onboarding =
            JSON.parse(
                savedAnswers
            );

    } catch (error) {

        onboarding = {};

    }
}


/* =====================================================
   SAVED UNIVERSITIES
===================================================== */

let savedUniversities =
JSON.parse(
    localStorage.getItem(
        "postcardsSavedUniversities"
    ) || "[]"
);


/* =====================================================
   STATE
===================================================== */

let activeFilter = "all";

let recommendedMode = false;


/* =====================================================
   NORMALIZE
===================================================== */

function normalize(value) {

    return String(
        value || ""
    )
    .toLowerCase()
    .normalize("NFD")
    .replace(
        /[\u0300-\u036f]/g,
        ""
    );

}


/* =====================================================
   MATCH SCORE
===================================================== */

function getMatchScore(university) {

    let score = 0;

    let possible = 0;


    /* FIELD */

    if (
        onboarding.study &&
        onboarding.study.length
    ) {

        possible += 3;

        const study =
            onboarding.study[0];

        if (
            university.fields.includes(
                study
            )
        ) {

            score += 3;

        }

    }


    /* COUNTRY */

    if (
        onboarding.countries &&
        onboarding.countries.length
    ) {

        possible += 3;

        const selectedCountries =
            onboarding.countries.map(
                normalize
            );

        if (
            selectedCountries.includes(
                normalize(
                    university.country
                )
            )
        ) {

            score += 3;

        }

    }


    /* ENVIRONMENT */

    if (
        onboarding.environment &&
        onboarding.environment.length
    ) {

        possible += 2;

        const environment =
            onboarding.environment.map(
                normalize
            );

        if (
            university.environment.some(
                item =>
                environment.includes(
                    normalize(item)
                )
            )
        ) {

            score += 2;

        }

    }


    /* PRIORITIES */

    if (
        onboarding.priorities &&
        onboarding.priorities.length
    ) {

        possible += 2;

        const priorities =
            onboarding.priorities.map(
                normalize
            );

        if (
            priorities.includes(
                "scholarships"
            ) &&
            university.scholarships
        ) {

            score += 1;

        }

        if (
            priorities.includes(
                "location"
            )
        ) {

            score += 1;

        }

    }


    if (
        possible === 0
    ) {

        return 70;

    }


    return Math.round(
        (
            score /
            possible
        ) * 100
    );

}


/* =====================================================
   SEARCH MATCH
===================================================== */

function matchesSearch(
    university,
    query
) {

    if (!query.trim()) {

        return true;

    }


    const searchable = [

        university.name,

        university.country,

        university.city,

        university.type,

        university.climate,

        university.international,

        university.scholarships,

        university.cost,

        ...university.fields,

        ...university.environment,

        ...university.keywords

    ]
    .map(normalize)
    .join(" ");


    const words =
        normalize(query)
        .split(/\s+/)
        .filter(Boolean);


    return words.every(
        word =>
        searchable.includes(word)
    );

}


/* =====================================================
   FILTER MATCH
===================================================== */

function matchesFilter(
    university
) {

    if (
        activeFilter ===
        "all"
    ) {

        return true;

    }


    if (
        activeFilter ===
        "warm"
    ) {

        return (
            university.climate ===
            "warm"
        );

    }


    if (
        activeFilter ===
        "cold"
    ) {

        return (
            university.climate ===
            "cold"
        );

    }


    if (
        activeFilter ===
        "city"
    ) {

        return university.environment.includes(
            "Big city"
        );

    }


    return university.fields.includes(
        activeFilter
    );

}


/* =====================================================
   GET RESULTS
===================================================== */

function getResults() {

    const query =
        searchInput.value;


    let results =
        universities.filter(
            university =>
            matchesSearch(
                university,
                query
            ) &&
            matchesFilter(
                university
            )
        );


    if (
        recommendedMode
    ) {

        results.sort(
            (
                a,
                b
            ) =>
            getMatchScore(b) -
            getMatchScore(a)
        );

    }


    return results;

}


/* =====================================================
   RENDER
===================================================== */

function render() {

    const results =
        getResults();


    grid.innerHTML =
        "";


    resultCount.textContent =
        `${results.length} ${
            results.length === 1
                ? "result"
                : "results"
        }`;


    if (
        results.length === 0
    ) {

        grid.innerHTML = `

            <div class="empty">

                <h2>
                    No postcards found.
                </h2>

                <p>
                    Try searching for a country,
                    city, university, field of study,
                    climate or interest.
                </p>

                <button
                    class="control-button"
                    onclick="resetEverything()"
                >
                    SHOW ALL UNIVERSITIES
                </button>

            </div>

        `;

        return;

    }


    results.forEach(
        university => {

            const card =
                document.createElement(
                    "article"
                );

            card.className =
                "university-card";


            const score =
                getMatchScore(
                    university
                );


            const isSaved =
                savedUniversities.includes(
                    university.name
                );


            card.innerHTML = `

                <button
                    class="save-button ${
                        isSaved
                            ? "saved"
                            : ""
                    }"
                    aria-label="Save university"
                >
                    ${
                        isSaved
                            ? "♥"
                            : "♡"
                    }
                </button>


                <div
                    class="card-image"
                    style="
                        background-image:
                        url('${university.image}')
                    "
                >

                    <div class="card-country">
                        ${university.country}
                    </div>

                </div>


                ${
                    recommendedMode
                    ? `
                        <div class="match">
                            ${score}% MATCH
                        </div>
                    `
                    : ""
                }


                <div class="card-content">

                    <div class="card-kicker">
                        ${university.type}
                    </div>

                    <h2 class="card-title">
                        ${university.name}
                    </h2>

                    <div class="card-location">
                        ${university.city}, ${university.country}
                    </div>


                    <div class="tags">

                        ${university.fields
                            .slice(0,3)
                            .map(
                                field =>
                                `<span class="tag">
                                    ${field
                                        .replace(
                                            " & Economics",
                                            ""
                                        )
                                        .replace(
                                            " & Technology",
                                            ""
                                        )}
                                </span>`
                            )
                            .join("")
                        }

                    </div>


                    <div class="card-info">

                        <div class="info-item">

                            <strong>
                                CLIMATE
                            </strong>

                            ${university.climate}

                        </div>


                        <div class="info-item">

                            <strong>
                                INTERNATIONAL
                            </strong>

                            ${university.international}

                        </div>


                        <div class="info-item">

                            <strong>
                                SCHOLARSHIPS
                            </strong>

                            ${university.scholarships}

                        </div>


                        <div class="info-item">

                            <strong>
                                COST
                            </strong>

                            ${university.cost}

                        </div>

                    </div>

                </div>

            `;


            /* SAVE */

            const saveButton =
                card.querySelector(
                    ".save-button"
                );


            saveButton.addEventListener(
                "click",
                function(event) {

                    event.stopPropagation();

                    toggleSave(
                        university.name
                    );

                }
            );


            /* OPEN */

            card.addEventListener(
                "click",
                function() {

                    openUniversity(
                        university
                    );

                }
            );


            grid.appendChild(
                card
            );

        }
    );

}


/* =====================================================
   SAVE
===================================================== */

function toggleSave(
    universityName
) {

    if (
        savedUniversities.includes(
            universityName
        )
    ) {

        savedUniversities =
            savedUniversities.filter(
                name =>
                name !== universityName
            );

    } else {

        savedUniversities.push(
            universityName
        );

    }


    localStorage.setItem(
        "postcardsSavedUniversities",
        JSON.stringify(
            savedUniversities
        )
    );


    render();

}


/* =====================================================
   MODAL
===================================================== */

function openUniversity(
    university
) {

    document.getElementById(
        "modalEyebrow"
    ).textContent =
        university.type;


    document.getElementById(
        "modalTitle"
    ).textContent =
        university.name;


    document.getElementById(
        "modalLocation"
    ).textContent =
        `${university.city}, ${university.country}`;


    document.getElementById(
        "modalDescription"
    ).textContent =
        university.description;


    const modalGrid =
        document.getElementById(
            "modalGrid"
        );


    const information = [

        [
            "FIELDS",
            university.fields.join(", ")
        ],

        [
            "CLIMATE",
            university.climate
        ],

        [
            "ENVIRONMENT",
            university.environment.join(", ")
        ],

        [
            "INTERNATIONAL PROFILE",
            university.international
        ],

        [
            "SCHOLARSHIPS",
            university.scholarships
        ],

        [
            "COST CATEGORY",
            university.cost
        ],

        [
            "PERSONAL MATCH",
            `${getMatchScore(university)}%`
        ],

        [
            "UNIVERSITY TYPE",
            university.type
        ]

    ];


    modalGrid.innerHTML =
        information
        .map(
            item => `

                <div class="modal-info">

                    <span>
                        ${item[0]}
                    </span>

                    <strong>
                        ${item[1]}
                    </strong>

                </div>

            `
        )
        .join("");


    modal.classList.add(
        "active"
    );

}


closeModal.addEventListener(
    "click",
    function() {

        modal.classList.remove(
            "active"
        );

    }
);


modal.addEventListener(
    "click",
    function(event) {

        if (
            event.target === modal
        ) {

            modal.classList.remove(
                "active"
            );

        }

    }
);


/* =====================================================
   FILTERS
===================================================== */

filters.forEach(
    filter => {

        filter.addEventListener(
            "click",
            function() {

                filters.forEach(
                    item =>
                    item.classList.remove(
                        "active"
                    )
                );


                filter.classList.add(
                    "active"
                );


                activeFilter =
                    filter.dataset.filter;


                render();

            }
        );

    }
);


/* =====================================================
   SEARCH
===================================================== */

searchInput.addEventListener(
    "input",
    function() {

        render();

    }
);


/* =====================================================
   RECOMMENDED
===================================================== */

recommendedButton.addEventListener(
    "click",
    function() {

        recommendedMode =
            !recommendedMode;


        if (
            recommendedMode
        ) {

            recommendedButton.textContent =
                "FOR YOU";

            recommendedButton.style.background =
                "#4c4038";

            recommendedButton.style.color =
                "white";

        } else {

            recommendedButton.textContent =
                "FOR ME";

            recommendedButton.style.background =
                "";

            recommendedButton.style.color =
                "";

        }


        render();

    }
);


/* =====================================================
   RESET
===================================================== */

function resetEverything() {

    searchInput.value =
        "";

    activeFilter =
        "all";

    recommendedMode =
        false;


    filters.forEach(
        filter => {

            filter.classList.remove(
                "active"
            );

        }
    );


    document
        .querySelector(
            '[data-filter="all"]'
        )
        .classList.add(
            "active"
        );


    recommendedButton.textContent =
        "FOR ME";

    recommendedButton.style.background =
        "";

    recommendedButton.style.color =
        "";


    render();

}


resetButton.addEventListener(
    "click",
    resetEverything
);


/* =====================================================
   PROFILE TEXT
===================================================== */

const profileText =
document.getElementById(
    "profileText"
);


if (
    onboarding.city
) {

    profileText.textContent =
        `${onboarding.city} • DISCOVER`;

}


/* =====================================================
   INITIAL RENDER
===================================================== */

render();

</script>
