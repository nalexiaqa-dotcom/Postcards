<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Postcards — Tell Us About You</title>


    <style>

        /* =====================================================
           RESET
        ===================================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        html,
        body {
            width: 100%;
            min-height: 100%;
        }


        body {

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            color: #202020;

            overflow-x: hidden;

            background: #e8e3da;
        }



        /* =====================================================
           WORLD BACKGROUND
        ===================================================== */

        .world {

            position: fixed;

            inset: 0;

            z-index: -5;

            overflow: hidden;

            background: #d8d3ca;
        }


        .background-image {

            position: absolute;

            inset: -4%;

            background-size: cover;

            background-position: center;

            opacity: 0;

            transform: scale(1.05);

            transition:
                opacity 1.5s ease,
                transform 8s ease;
        }


        .background-image.active {

            opacity: 1;

            transform: scale(1);
        }


        .world::after {

            content: "";

            position: absolute;

            inset: 0;

            background:
                linear-gradient(
                    90deg,
                    rgba(15, 15, 15, 0.50),
                    rgba(15, 15, 15, 0.17)
                );

            z-index: 3;

            pointer-events: none;
        }



        /* =====================================================
           TOP BAR
        ===================================================== */

        .top-bar {

            position: fixed;

            top: 0;

            left: 0;

            right: 0;

            padding:
                28px 34px;

            display: flex;

            align-items: center;

            justify-content: space-between;

            z-index: 20;

            color: white;
        }


        .location {

            font-size: 10px;

            letter-spacing: 0.22em;

            text-transform: uppercase;

            opacity: 0.9;
        }


        .logo {

            font-size: 11px;

            font-weight: 700;

            letter-spacing: 0.32em;

            text-transform: uppercase;
        }



        /* =====================================================
           MAIN
        ===================================================== */

        .main {

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            padding:
                95px 20px 50px;
        }



        /* =====================================================
           MAIN QUESTION CARD
        ===================================================== */

        .card {

            width:
                min(
                    820px,
                    94vw
                );

            min-height: 555px;

            background:
                rgba(
                    247,
                    244,
                    237,
                    0.97
                );

            box-shadow:
                0 30px 70px
                rgba(0,0,0,0.28);

            position: relative;

            overflow: hidden;

            display: flex;

            flex-direction: column;

            animation:
                cardEntrance
                0.8s
                cubic-bezier(.2,.8,.2,1)
                forwards;
        }


        @keyframes cardEntrance {

            from {

                opacity: 0;

                transform:
                    translateY(30px)
                    scale(0.98);
            }

            to {

                opacity: 1;

                transform:
                    translateY(0)
                    scale(1);
            }
        }



        /* =====================================================
           HEADER
        ===================================================== */

        .card-header {

            padding:
                27px 42px 22px;

            border-bottom:
                1px solid
                rgba(0,0,0,0.11);

            display: flex;

            align-items: center;

            justify-content: space-between;
        }


        .header-label {

            font-size: 9px;

            font-weight: 700;

            letter-spacing: 0.23em;

            text-transform: uppercase;

            color: #77736c;
        }


        .step-counter {

            font-size: 9px;

            font-weight: 700;

            letter-spacing: 0.17em;

            text-transform: uppercase;

            color: #77736c;
        }



        /* =====================================================
           CONTENT
        ===================================================== */

        .content {

            flex: 1;

            padding:
                45px 55px 35px;

            display: flex;

            flex-direction: column;

            justify-content: center;
        }


        .question-number {

            font-size: 9px;

            font-weight: 700;

            letter-spacing: 0.22em;

            text-transform: uppercase;

            color: #817c74;

            margin-bottom: 16px;
        }


        .question-title {

            font-family:
                Georgia,
                "Times New Roman",
                serif;

            font-size:
                clamp(
                    38px,
                    6vw,
                    66px
                );

            font-weight: 400;

            line-height: 0.96;

            letter-spacing:
                -0.045em;

            color: #202020;

            max-width: 680px;

            margin-bottom: 16px;
        }


        .question-description {

            font-size: 12px;

            line-height: 1.65;

            color: #77736c;

            max-width: 500px;

            margin-bottom: 29px;
        }



        /* =====================================================
           TEXT INPUTS
        ===================================================== */

        .input {

            width: 100%;

            padding:
                13px 2px;

            margin-bottom: 15px;

            border: none;

            border-bottom:
                1px solid
                #aaa69e;

            background:
                transparent;

            outline: none;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            font-size: 14px;

            color: #202020;

            transition:
                border-color 0.25s ease;
        }


        .input::placeholder {

            color: #aaa69e;
        }


        .input:focus {

            border-bottom:
                1px solid
                #202020;
        }



        /* =====================================================
           OPTIONS
        ===================================================== */

        .options {

            display: grid;

            grid-template-columns:
                repeat(
                    3,
                    1fr
                );

            gap: 9px;

            max-height: 225px;

            overflow-y: auto;

            padding-right: 4px;
        }


        .options::-webkit-scrollbar {

            width: 4px;
        }


        .options::-webkit-scrollbar-thumb {

            background:
                #aaa69e;
        }


        .option {

            position: relative;
        }


        .option input {

            position: absolute;

            opacity: 0;

            pointer-events: none;
        }


        .option label {

            display: flex;

            align-items: center;

            min-height: 48px;

            padding:
                11px 13px;

            border:
                1px solid
                #c9c5bd;

            background:
                rgba(
                    255,
                    255,
                    255,
                    0.35
                );

            cursor: pointer;

            font-size: 10px;

            line-height: 1.3;

            color: #55514b;

            transition:
                all 0.22s ease;
        }


        .option label:hover {

            border-color:
                #77736c;

            background:
                rgba(
                    255,
                    255,
                    255,
                    0.7
                );

            transform:
                translateY(-1px);
        }


        .option input:checked + label {

            background:
                #202020;

            border-color:
                #202020;

            color:
                #f7f4ed;

            transform:
                translateY(-1px);
        }



        /* =====================================================
           BUTTONS
        ===================================================== */

        .buttons {

            margin-top: 27px;

            display: flex;

            align-items: center;

            justify-content: space-between;
        }


        .back-button {

            border: none;

            background:
                transparent;

            font-size: 9px;

            font-weight: 700;

            letter-spacing: 0.18em;

            text-transform: uppercase;

            color: #77736c;

            cursor: pointer;

            padding: 8px 0;

            transition:
                color 0.2s ease;
        }


        .back-button:hover {

            color:
                #202020;
        }


        .continue-button {

            border:
                1px solid
                #202020;

            background:
                #202020;

            color:
                #f7f4ed;

            padding:
                14px 25px;

            font-size: 9px;

            font-weight: 700;

            letter-spacing: 0.18em;

            text-transform: uppercase;

            cursor: pointer;

            transition:
                all 0.25s ease;
        }


        .continue-button:hover {

            background:
                transparent;

            color:
                #202020;

            transform:
                translateY(-2px);
        }



        /* =====================================================
           PROGRESS BAR
        ===================================================== */

        .progress-container {

            height: 4px;

            width: 100%;

            background:
                #d9d5cd;
        }


        .progress {

            height: 100%;

            width: 14.28%;

            background:
                #202020;

            transition:
                width 0.5s ease;
        }



        /* =====================================================
           SUMMARY
        ===================================================== */

        .summary {

            display: none;

            flex: 1;

            padding:
                45px 55px 40px;

            flex-direction: column;

            justify-content: center;
        }


        .summary.active {

            display: flex;
        }


        .summary .question-number {

            margin-bottom: 17px;
        }


        .summary-title {

            font-family:
                Georgia,
                "Times New Roman",
                serif;

            font-size:
                clamp(
                    42px,
                    6vw,
                    68px
                );

            font-weight: 400;

            line-height: 0.95;

            letter-spacing:
                -0.045em;

            margin-bottom: 14px;
        }


        .summary-subtitle {

            font-size: 12px;

            line-height: 1.6;

            color: #77736c;

            margin-bottom: 25px;
        }


        .summary-box {

            padding:
                20px 22px;

            border:
                1px solid
                #cbc7bf;

            background:
                rgba(
                    255,
                    255,
                    255,
                    0.35
                );

            font-size: 10px;

            line-height: 1.8;

            color: #66615a;

            margin-bottom: 24px;

            max-height: 180px;

            overflow-y: auto;
        }


        .summary-box strong {

            color:
                #202020;

            font-size: 8px;

            letter-spacing:
                0.14em;
        }



        /* =====================================================
           DECORATIVE NUMBER
        ===================================================== */

        .corner-number {

            position: absolute;

            right: 30px;

            bottom: 25px;

            font-family:
                Georgia,
                serif;

            font-size: 38px;

            line-height: 1;

            color:
                rgba(
                    32,
                    32,
                    32,
                    0.08
                );

            pointer-events: none;
        }



        /* =====================================================
           RESPONSIVE
        ===================================================== */

        @media (max-width: 760px) {

            .main {

                padding:
                    90px 15px 35px;
            }


            .card {

                width: 95vw;

                min-height:
                    600px;
            }


            .card-header {

                padding:
                    22px 25px 18px;
            }


            .content {

                padding:
                    35px 28px 30px;
            }


            .options {

                grid-template-columns:
                    repeat(
                        2,
                        1fr
                    );

                max-height:
                    260px;
            }


            .question-title {

                font-size:
                    clamp(
                        38px,
                        10vw,
                        55px
                    );
            }


            .summary {

                padding:
                    35px 28px;
            }
        }


        @media (max-width: 480px) {

            .top-bar {

                padding:
                    20px;
            }


            .location {

                font-size: 8px;

                letter-spacing:
                    0.15em;
            }


            .logo {

                font-size: 9px;

                letter-spacing:
                    0.23em;
            }


            .card {

                min-height:
                    650px;
            }


            .options {

                grid-template-columns:
                    1fr;

                max-height:
                    260px;
            }


            .option label {

                min-height:
                    44px;
            }


            .buttons {

                margin-top:
                    20px;
            }


            .continue-button {

                padding:
                    13px 18px;
            }
        }

    </style>

</head>


<body>


    <!-- =====================================================
         CHANGING WORLD BACKGROUND
    ====================================================== -->

    <div class="world">

        <div
            class="background-image active"
            id="backgroundA"
        ></div>


        <div
            class="background-image"
            id="backgroundB"
        ></div>

    </div>



    <!-- =====================================================
         TOP BAR
    ====================================================== -->

    <header class="top-bar">

        <div
            class="location"
            id="location"
        >
            Paris, France
        </div>


        <div class="logo">
            POSTCARDS
        </div>

    </header>



    <!-- =====================================================
         MAIN
    ====================================================== -->

    <main class="main">


        <section class="card">


            <!-- HEADER -->

            <div class="card-header">

                <div class="header-label">
                    Tell us about you
                </div>


                <div
                    class="step-counter"
                    id="stepCounter"
                >
                    01 / 07
                </div>

            </div>



            <!-- QUESTIONS -->

            <div
                class="content"
                id="questionContent"
            >

            </div>



            <!-- SUMMARY -->

            <div
                class="summary"
                id="summary"
            >

                <div class="question-number">
                    YOUR POSTCARD
                </div>


                <h1 class="summary-title">
                    Your journey<br>
                    starts here.
                </h1>


                <p class="summary-subtitle">
                    We've got a better idea of what
                    you're looking for.
                </p>


                <div
                    class="summary-box"
                    id="summaryBox"
                ></div>


                <button
                    class="continue-button"
                    id="finishButton"
                >
                    Explore my universities →
                </button>

            </div>



            <!-- DECORATIVE NUMBER -->

            <div
                class="corner-number"
                id="cornerNumber"
            >
                01
            </div>



            <!-- PROGRESS -->

            <div class="progress-container">

                <div
                    class="progress"
                    id="progress"
                ></div>

            </div>


        </section>


    </main>



    <script>

        /* =====================================================
           QUESTION DATA
        ===================================================== */

        const questions = [

            {
                title:
                    "Where are you from?",

                description:
                    "Start with where you currently call home.",

                type:
                    "location"
            },


            {
                title:
                    "Where could you see yourself studying?",

                description:
                    "Choose the places you'd like to explore. You can select more than one.",

                type:
                    "countries",

                multiple:
                    true,

                options: [

                    "United States",
                    "Canada",
                    "United Kingdom",
                    "Spain",
                    "France",
                    "Italy",
                    "Germany",
                    "Netherlands",
                    "Australia",
                    "Japan",
                    "South Korea",
                    "Singapore",
                    "Mexico",
                    "Other"

                ]
            },


            {
                title:
                    "What would you like to study?",

                description:
                    "Don't worry if you haven't decided yet.",

                type:
                    "study",

                multiple:
                    true,

                options: [

                    "Business & Economics",
                    "Engineering & Technology",
                    "Medicine & Health",
                    "Arts & Design",
                    "Communication & Media",
                    "Social Sciences",
                    "Law",
                    "Education",
                    "Science",
                    "Architecture",
                    "I'm not sure yet"

                ]
            },


            {
                title:
                    "What matters most to you?",

                description:
                    "Choose the factors that could influence your decision.",

                type:
                    "priorities",

                multiple:
                    true,

                options: [

                    "Tuition",
                    "Scholarships",
                    "Academic reputation",
                    "Location",
                    "Campus life",
                    "Career opportunities",
                    "Internships",
                    "Research opportunities",
                    "Student diversity",
                    "University size",
                    "Housing",
                    "Distance from home"

                ]
            },


            {
                title:
                    "What kind of place feels like home?",

                description:
                    "Choose the environments you'd enjoy living in.",

                type:
                    "environment",

                multiple:
                    true,

                options: [

                    "Big city",
                    "Small city",
                    "Small town",
                    "Warm climate",
                    "Cold climate",
                    "Coastal",
                    "Urban",
                    "Nature",
                    "Fast-paced",
                    "Quiet"

                ]
            },


            {
                title:
                    "What makes you, you?",

                description:
                    "Choose a few interests so we can personalize your experience.",

                type:
                    "interests",

                multiple:
                    true,

                options: [

                    "Reading",
                    "Photography",
                    "Travel",
                    "Music",
                    "Sports",
                    "Technology",
                    "Business",
                    "Art",
                    "Fashion",
                    "Cooking",
                    "Animals",
                    "Environment",
                    "Movies",
                    "Gaming",
                    "Volunteering"

                ]
            },


            {
                title:
                    "Do you already have universities in mind?",

                description:
                    "Optional. You can always discover and save universities later.",

                type:
                    "universities"
            }

        ];



        /* =====================================================
           VARIABLES
        ===================================================== */

        let currentQuestion = 0;

        const answers = {};



        /* =====================================================
           ELEMENTS
        ===================================================== */

        const questionContent =
            document.getElementById(
                "questionContent"
            );


        const summary =
            document.getElementById(
                "summary"
            );


        const summaryBox =
            document.getElementById(
                "summaryBox"
            );


        const stepCounter =
            document.getElementById(
                "stepCounter"
            );


        const progress =
            document.getElementById(
                "progress"
            );


        const cornerNumber =
            document.getElementById(
                "cornerNumber"
            );


        const locationText =
            document.getElementById(
                "location"
            );


        const backgroundA =
            document.getElementById(
                "backgroundA"
            );


        const backgroundB =
            document.getElementById(
                "backgroundB"
            );



        /* =====================================================
           DESTINATIONS
        ===================================================== */

        const destinations = [

            {
                name:
                    "Paris, France",

                image:
                    "https://images.unsplash.com/photo-1499856871958-5b9627545d1a?auto=format&fit=crop&w=2200&q=90"
            },


            {
                name:
                    "Tokyo, Japan",

                image:
                    "https://images.unsplash.com/photo-1513407030348-c983a97b98d8?auto=format&fit=crop&w=2200&q=90"
            },


            {
                name:
                    "New York, USA",

                image:
                    "https://images.unsplash.com/photo-1496588152823-86ff7695e68f?auto=format&fit=crop&w=2200&q=90"
            },


            {
                name:
                    "Barcelona, Spain",

                image:
                    "https://images.unsplash.com/photo-1539037116277-4db20889f2d4?auto=format&fit=crop&w=2200&q=90"
            },


            {
                name:
                    "Seoul, South Korea",

                image:
                    "https://images.unsplash.com/photo-1538485399081-7c8979d1d5f1?auto=format&fit=crop&w=2200&q=90"
            },


            {
                name:
                    "Santorini, Greece",

                image:
                    "https://images.unsplash.com/photo-1570077188670-e3a8d69ac5ff?auto=format&fit=crop&w=2200&q=90"
            },


            {
                name:
                    "London, England",

                image:
                    "https://images.unsplash.com/photo-1513635269975-59663e0ac1ad?auto=format&fit=crop&w=2200&q=90"
            },


            {
                name:
                    "Rome, Italy",

                image:
                    "https://images.unsplash.com/photo-1529260830199-42c24126f198?auto=format&fit=crop&w=2200&q=90"
            }

        ];


        let currentDestination = 0;

        let showingA = true;



        /* =====================================================
           BACKGROUND FUNCTIONS
        ===================================================== */

        function preloadImages() {

            destinations.forEach(
                destination => {

                    const image =
                        new Image();

                    image.src =
                        destination.image;

                }
            );

        }


        function setInitialBackground() {

            backgroundA.style.backgroundImage =
                `url("${destinations[0].image}")`;

            locationText.textContent =
                destinations[0].name;

        }


        function changeDestination() {

            currentDestination++;

            if (
                currentDestination >=
                destinations.length
            ) {

                currentDestination = 0;

            }


            const destination =
                destinations[
                    currentDestination
                ];


            const nextBackground =
                showingA
                    ? backgroundB
                    : backgroundA;


            const oldBackground =
                showingA
                    ? backgroundA
                    : backgroundB;


            nextBackground.style.backgroundImage =
                `url("${destination.image}")`;


            const image =
                new Image();


            image.onload =
                function() {

                    nextBackground.classList.add(
                        "active"
                    );


                    oldBackground.classList.remove(
                        "active"
                    );


                    showingA =
                        !showingA;


                    locationText.textContent =
                        destination.name;

                };


            image.src =
                destination.image;

        }


        setInitialBackground();

        preloadImages();


        setInterval(
            changeDestination,
            7000
        );



        /* =====================================================
           RENDER QUESTION
        ===================================================== */

        function renderQuestion() {

            const question =
                questions[currentQuestion];


            questionContent.innerHTML = "";


            questionContent.style.display =
                "flex";


            summary.classList.remove(
                "active"
            );


            /* QUESTION NUMBER */

            const number =
                document.createElement(
                    "div"
                );


            number.className =
                "question-number";


            number.textContent =
                `0${currentQuestion + 1} / 07`;


            /* TITLE */

            const title =
                document.createElement(
                    "h1"
                );


            title.className =
                "question-title";


            title.textContent =
                question.title;


            /* DESCRIPTION */

            const description =
                document.createElement(
                    "p"
                );


            description.className =
                "question-description";


            description.textContent =
                question.description;


            questionContent.appendChild(
                number
            );


            questionContent.appendChild(
                title
            );


            questionContent.appendChild(
                description
            );



            /* =================================================
               LOCATION
            ================================================= */

            if (
                question.type ===
                "location"
            ) {

                questionContent.innerHTML += `

                    <input
                        class="input"
                        id="country"
                        type="text"
                        placeholder="Country"
                        value="${answers.country || ""}"
                    >

                    <input
                        class="input"
                        id="city"
                        type="text"
                        placeholder="City"
                        value="${answers.city || ""}"
                    >

                `;

            }



            /* =================================================
               UNIVERSITIES
            ================================================= */

            else if (
                question.type ===
                "universities"
            ) {

                questionContent.innerHTML += `

                    <input
                        class="input"
                        id="universities"
                        type="text"
                        placeholder="e.g. NYU, Bocconi, UBC..."
                        value="${answers.universities || ""}"
                    >

                `;

            }



            /* =================================================
               OPTIONS
            ================================================= */

            else {

                const options =
                    document.createElement(
                        "div"
                    );


                options.className =
                    "options";


                question.options.forEach(
                    (option, index) => {

                        const wrapper =
                            document.createElement(
                                "div"
                            );


                        wrapper.className =
                            "option";


                        const id =
                            `option-${currentQuestion}-${index}`;


                        const input =
                            document.createElement(
                                "input"
                            );


                        input.type =
                            question.multiple
                                ? "checkbox"
                                : "radio";


                        input.name =
                            question.type;


                        input.id =
                            id;


                        input.value =
                            option;


                        const previous =
                            answers[
                                question.type
                            ];


                        if (
                            Array.isArray(
                                previous
                            ) &&
                            previous.includes(
                                option
                            )
                        ) {

                            input.checked =
                                true;

                        }


                        const label =
                            document.createElement(
                                "label"
                            );


                        label.htmlFor =
                            id;


                        label.textContent =
                            option;


                        wrapper.appendChild(
                            input
                        );


                        wrapper.appendChild(
                            label
                        );


                        options.appendChild(
                            wrapper
                        );

                    }
                );


                questionContent.appendChild(
                    options
                );

            }



            /* =================================================
               BUTTONS
            ================================================= */

            const buttons =
                document.createElement(
                    "div"
                );


            buttons.className =
                "buttons";


            if (
                currentQuestion > 0
            ) {

                const back =
                    document.createElement(
                        "button"
                    );


                back.className =
                    "back-button";


                back.type =
                    "button";


                back.textContent =
                    "← Back";


                back.onclick =
                    previousQuestion;


                buttons.appendChild(
                    back
                );

            }


            else {

                const spacer =
                    document.createElement(
                        "div"
                    );


                buttons.appendChild(
                    spacer
                );

            }


            const continueButton =
                document.createElement(
                    "button"
                );


            continueButton.className =
                "continue-button";


            continueButton.type =
                "button";


            continueButton.textContent =
                currentQuestion ===
                questions.length - 1
                    ? "Finish →"
                    : "Continue →";


            continueButton.onclick =
                nextQuestion;


            buttons.appendChild(
                continueButton
            );


            questionContent.appendChild(
                buttons
            );



            /* =================================================
               PROGRESS
            ================================================= */

            const percentage =
                (
                    (currentQuestion + 1)
                    /
                    questions.length
                ) * 100;


            progress.style.width =
                `${percentage}%`;


            stepCounter.textContent =
                `0${currentQuestion + 1} / 07`;


            cornerNumber.textContent =
                `0${currentQuestion + 1}`;

        }



        /* =====================================================
           SAVE ANSWER
        ===================================================== */

        function saveAnswer() {

            const question =
                questions[currentQuestion];


            if (
                question.type ===
                "location"
            ) {

                const country =
                    document.getElementById(
                        "country"
                    ).value.trim();


                const city =
                    document.getElementById(
                        "city"
                    ).value.trim();


                answers.country =
                    country;


                answers.city =
                    city;

            }


            else if (
                question.type ===
                "universities"
            ) {

                answers.universities =
                    document.getElementById(
                        "universities"
                    ).value.trim();

            }


            else {

                const selected =
                    [
                        ...document.querySelectorAll(
                            `input[name="${question.type}"]:checked`
                        )
                    ].map(
                        input =>
                            input.value
                    );


                answers[
                    question.type
                ] =
                    selected;

            }


            localStorage.setItem(
                "postcardsAnswers",
                JSON.stringify(
                    answers
                )
            );

        }



        /* =====================================================
           NEXT
        ===================================================== */

        function nextQuestion() {

            saveAnswer();


            if (
                currentQuestion <
                questions.length - 1
            ) {

                currentQuestion++;

                renderQuestion();

            }


            else {

                showSummary();

            }

        }



        /* =====================================================
           BACK
        ===================================================== */

        function previousQuestion() {

            saveAnswer();


            currentQuestion--;


            renderQuestion();

        }



        /* =====================================================
           SUMMARY
        ===================================================== */

        function showSummary() {

            questionContent.style.display =
                "none";


            summary.classList.add(
                "active"
            );


            stepCounter.textContent =
                "READY";


            cornerNumber.textContent =
                "08";


            progress.style.width =
                "100%";


            const interests =
                answers.interests?.join(
                    ", "
                ) ||
                "Still discovering";


            const study =
                answers.study?.join(
                    ", "
                ) ||
                "Still exploring";


            const countries =
                answers.countries?.join(
                    ", "
                ) ||
                "Open to possibilities";


            const priorities =
                answers.priorities?.join(
                    ", "
                ) ||
                "We'll discover them together";


            summaryBox.innerHTML = `

                <strong>HOME</strong><br>

                ${
                    answers.city ||
                    "Your city"
                },
                ${
                    answers.country ||
                    "Your country"
                }

                <br><br>


                <strong>PLACES TO EXPLORE</strong><br>

                ${countries}

                <br><br>


                <strong>FIELD OF STUDY</strong><br>

                ${study}

                <br><br>


                <strong>WHAT MATTERS TO YOU</strong><br>

                ${priorities}

                <br><br>


                <strong>INTERESTS</strong><br>

                ${interests}

            `;

        }



        /* =====================================================
           FINISH
        ===================================================== */

        document
            .getElementById(
                "finishButton"
            )
            .addEventListener(
                "click",
                function() {

                    window.location.href =
                        "discover.html";

                }
            );



        /* =====================================================
           LOAD SAVED ANSWERS
        ===================================================== */

        const savedAnswers =
            localStorage.getItem(
                "postcardsAnswers"
            );


        if (savedAnswers) {

            try {

                Object.assign(
                    answers,
                    JSON.parse(
                        savedAnswers
                    )
                );

            }

            catch (error) {

                console.log(
                    "Starting a new questionnaire."
                );

            }

        }



        /* =====================================================
           START
        ===================================================== */

        renderQuestion();

    </script>

</body>

</html>
